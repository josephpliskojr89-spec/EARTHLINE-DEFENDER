  });
}

// Spawn a guaranteed weapon-upgrade drop at (x,y).
function forceWeaponDrop(x,y){
  G.enemies.push({
    type:'power',kind:'weapon',x,y,vx:0,vy:90,r:14,hp:1,maxHp:1,rot:0,spin:1.5,
    color:'#ff2bd6',pulse:0,score:0,dmg:0
  });
}

// Earthquake Bomb pickup: rare temporary super-weapon. Bigger sprite, slower
// fall, distinctive orange — feels like a "lucky" find.
function spawnQuakeBomb(x,y){
  G.enemies.push({
    type:'power',kind:'quakebomb',x,y,vx:0,vy:75,r:18,hp:1,maxHp:1,rot:0,spin:2,
    color:'#ff7a3a',pulse:0,score:0,dmg:0
  });
}
// Roll for an Earthquake Bomb drop on a kill. Strict gates: never during boss
// fights, never if one is already on screen (single-instance). Uses each
// enemy's BASE hp from ENEMY_DEFS so per-stage hp scaling doesn't muddy the
// elite/tough thresholds.
function rollQuakeBombDrop(e){
  if(G.boss)return false;
  for(const en of G.enemies){if(en.type==='power' && en.kind==='quakebomb')return false}
  const def=ENEMY_DEFS[e.type];if(!def)return false;
  const baseHp=def.hp;
  let chance=0;
  if(baseHp>=8) chance=.04;       // blackfriday(8) / ufo(10) / gravturret(12)
  else if(baseHp>=4) chance=.012; // swarmer(5) / leech(4)
  else return false;
  return Math.random()<chance;
}

// Deterministic 12-step weapon progression:
// 0..2 pew L1-3, 3..5 laser L1-3, 6..8 missiles L1-3, 9..11 pyro L1-3.
const WEAPON_SEQUENCE=[
  ['pew',1],['pew',2],['pew',3],
  ['laser',1],['laser',2],['laser',3],
  ['missiles',1],['missiles',2],['missiles',3],
  ['pyro',1],['pyro',2],['pyro',3]
];
function applyWeaponStep(s){
  const [w,lv]=WEAPON_SEQUENCE[Math.min(WEAPON_SEQUENCE.length-1,Math.max(0,s))];
  G.weapon=w;G.weaponLv=lv;
  weaponInd.textContent=WEAPON_NAMES[w]+(lv>1?' LV'+lv:'');
}

function collectPower(k){
  if(k==='repair'){G.earth=clamp(G.earth+15,0,100);toastMsg('EARTH PATCHED +15')}
  else if(k==='rapid'){G.rapid=8;toastMsg('RAPID FIRE')}
  else if(k==='shield'){G.shieldActive=8;toastMsg('SHIELD ACTIVE')}
  else if(k==='quakebomb'){
    // Refresh, don't stack — each pickup grants exactly 5 shots.
    G.bombShots=5;
    toastMsg('EARTHQUAKE BOMB · 5 SHOTS',1600);
    Audio.sExplode();
  }
  else if(k==='weapon'){
    if(G.weaponStep>=WEAPON_SEQUENCE.length-1){
      // Already at max — extra pickups award bonus score instead of cycling
      const bonus=Math.floor(500*G.multi);
      G.score+=bonus;
      toastMsg('MAX WEAPON · +'+bonus.toLocaleString());
    }else{
      G.weaponStep++;
      applyWeaponStep(G.weaponStep);
      toastMsg('WEAPON: '+WEAPON_NAMES[G.weapon]+(G.weaponLv>1?' LV '+G.weaponLv:''));
    }
  }
  Audio.sPower();
}

// ---------- Boss ----------
function spawnBoss(kind){
  const def=BOSS_DEFS[kind];if(!def)return;
  G.boss={
    type:'boss', kind, name:def.name,
    x:W/2, y:-80, tx:W/2, ty:H*.22,
    r:def.r, hp:def.hp, maxHp:def.hp,
    color:def.color, vx:0, vy:0, spd:def.spd,
    shootT:def.shootEvery, shootEvery:def.shootEvery,
    minionT:def.minionEvery, minionEvery:def.minionEvery,
    phases:def.phases.slice(), pulse:0, time:0,
    moveT:0, anchorX:W/2, anchorY:H*.22,
    state:0
  };
  G.bossMax=def.hp;G.bossPhase=1;G.bossTriggered=new Set();
  bossNameEl.textContent=def.name;
  bossBarFill.style.width='100%';
  bossBarWrap.style.display='flex';
  Audio.sBossSpawn();
  Audio.play('boss');
}
function endBoss(){
  if(!G.boss)return;
  burst(G.boss.x,G.boss.y,G.boss.color,60,360,1.4);
  shockwave(G.boss.x,G.boss.y);
  G.shake=Math.max(G.shake,16);
  Audio.sExplode();
  G.score+=Math.floor(G.boss.maxHp*8);
  G.boss=null;
  bossBarWrap.style.display='none';
  Audio.play('main');
}

// ---------- Comic Dialog ----------
let dialogQueue=[],dialogIdx=0,onDialogDone=null,dialogTapCount=0;
function showDialog(key,after){
  if(!DIALOG[key]){if(after)after();return}
  dialogQueue=DIALOG[key].slice();dialogIdx=0;dialogTapCount=0;onDialogDone=after||null;
  state=STATE.DIALOG;
  renderDialog();
  comicEl.style.display='flex';
}
function renderDialog(){
  const d=dialogQueue[dialogIdx];if(!d){closeDialog();return}
  comicWho.textContent=d.who;
  comicText.textContent=d.t;
  const p=PORTRAITS[d.p]||PORTRAITS.moore;
  comicPortrait.style.backgroundImage='url('+p.img+')';
  comicPortrait.style.backgroundPosition=p.pos;
}
function advanceDialog(){
  // require 2 taps to dismiss per panel (per spec)
  dialogTapCount++;
  if(dialogTapCount<2)return;
  dialogTapCount=0;
  dialogIdx++;
  if(dialogIdx>=dialogQueue.length){closeDialog();return}
  renderDialog();
}
function closeDialog(){
  comicEl.style.display='none';
  const cb=onDialogDone;onDialogDone=null;
  // resume gameplay state based on whether we have boss
  state=(G.boss)?STATE.BOSS:STATE.PLAYING;
  if(cb)cb();
}

// ---------- Stinger (wave clear / boss incoming) ----------
function stinger(text,after,dur=1400){
  stingerText.textContent=text;
  stingerEl.style.display='flex';
  setTimeout(()=>{stingerEl.style.display='none';if(after)after()},dur);
}

// ---------- Stage / Wave Mgmt ----------
function startStage(stageIdx){
  G.stage=stageIdx+1;
  G.stageDef=STAGES[stageIdx];
  G.waveInStage=0;
  G.weaponDropsThisStage=0;
  G.killsThisStage=0;
  G.yeetAvailable=true; // refresh once-per-stage nuke
  yeetBtn.disabled=false;yeetBtn.classList.add('ready');
  stinger(G.stageDef.name,()=>{startWaveInStage(0)},1400);
}

function startWaveInStage(idx){
  G.waveInStage=idx+1;
  const def={name:G.stageDef.name+' · WAVE '+G.waveInStage+'/5',
             dur:G.stageDef.waveDur, rate:G.stageDef.rate, types:G.stageDef.enemies};
  G.waveDef=def;G.waveProgress=0;G.spawnT=.5;
  waveNameEl.textContent=def.name;
  state=STATE.PLAYING;
}

function startBossForStage(){
  const stageDef=G.stageDef;
  const proceed=()=>{
    stinger('BOSS INCOMING',()=>{spawnBoss(stageDef.boss);state=STATE.BOSS;
      // Yeet locks out during boss fights
      yeetBtn.disabled=true;yeetBtn.classList.remove('ready');
    },1100);
  };
  if(stageDef.bossDialog){
    showDialog(stageDef.bossDialog,proceed);
  }else{
    proceed();
  }
}

function onBossDefeated(){
  // Boss is gone (endBoss already cleaned up state). Show stage clear.
  const wasFinal=G.stageDef && G.stageDef.final;
  if(wasFinal){
    // Campaign complete!
    campaignDone=true;localStorage.setItem('ed_campaign','1');
    cynthiaUnlocked=true;
    stinger('EARTH SAVED',()=>{
      showDialog('victory',()=>{victoryScreen()});
    },1600);
    return;
  }
  stinger('STAGE CLEAR',()=>{
    if(G.stage>=STAGES.length){
      // safety: somehow past final stage without final flag
      campaignDone=true;localStorage.setItem('ed_campaign','1');
      cynthiaUnlocked=true;
      showDialog('victory',()=>{victoryScreen()});
      return;
    }
    startStage(G.stage); // current stage was G.stage; next index is G.stage (0-based -> stage)
  },1600);
}

// After a non-boss wave timer ends: advance through 5 waves, then boss.
function advanceWaveOrBoss(){
  if(G.waveInStage<5){
    stinger('WAVE CLEAR',()=>startWaveInStage(G.waveInStage),1100);
  }else{
    startBossForStage();
  }
}

// ---------- Update ----------
function update(dt){
  G.time+=dt;
  G.starOff+=dt*40; G.starOff2+=dt*16;
  G.fireCd=Math.max(0,G.fireCd-dt);
  G.rapid=Math.max(0,G.rapid-dt);
  G.shieldActive=Math.max(0,G.shieldActive-dt);
  G.shake=Math.max(0,G.shake-dt*22);
  G.multiTimer=Math.max(0,G.multiTimer-dt);
  G.invuln=Math.max(0,G.invuln-dt);
  if(G.multiTimer<=0 && G.multi>1){G.multi=Math.max(1,G.multi-dt*.5)}
  // Doom Squadron duration
  const wasActive=G.doomActive>0;
  G.doomActive=Math.max(0,G.doomActive-dt);
  if(wasActive && G.doomActive<=0){
    doomBtn.classList.remove('active');
    Audio.endDoom();
    toastMsg('DOOM SQUADRON OFFLINE',1100);
  }
  if(G.doomActive>0){
    doomTimerEl.textContent=Math.ceil(G.doomActive);
  }
  // Yeet button visual (once-per-stage). Locked out during boss fights.
  const yeetUsable=G.yeetAvailable && !G.boss && state===STATE.PLAYING;
  yeetCd.style.background=yeetUsable?'conic-gradient(transparent 0deg,transparent 360deg)':'conic-gradient(rgba(0,0,0,.55) 0deg,rgba(0,0,0,.55) 360deg)';
  yeetBtn.disabled=!yeetUsable;
  if(yeetUsable){yeetBtn.classList.add('ready')}else{yeetBtn.classList.remove('ready')}
  // Doom button visual: draining "runner" ring while active, charge ring when idle
  if(G.doomActive>0){
    const frac=Math.max(0,G.doomActive/30);
    doomCd.style.background=`conic-gradient(rgba(255,210,58,.85) ${frac*360}deg,rgba(0,0,0,.35) 0)`;
  }else{
    doomCd.style.background=`conic-gradient(rgba(0,0,0,.55) ${(1-G.doomCharge/100)*360}deg,transparent 0)`;
  }
  const doomReady=G.doomCharge>=100 && G.doomActive<=0;
  doomBtn.disabled=!doomReady;
  if(doomReady){doomBtn.classList.add('ready')}else{doomBtn.classList.remove('ready')}

  // Player movement
  const p=G.player;if(!p)return;
  let mx=0,my=0;
  if(keys.has('arrowleft')||keys.has('a'))mx--;
  if(keys.has('arrowright')||keys.has('d'))mx++;
  if(keys.has('arrowup')||keys.has('w'))my--;
  if(keys.has('arrowdown')||keys.has('s'))my++;
  if(mx||my){const l=Math.hypot(mx,my)||1;p.x+=mx/l*p.spd*dt;p.y+=my/l*p.spd*dt}
  if(pointer.active){
    const lerp=Math.min(1,dt*14);
    p.x+=(pointer.x-p.x)*lerp;p.y+=(pointer.y-p.y)*lerp;
  }
  p.x=clamp(p.x,24,W-24);p.y=clamp(p.y,Math.max(96,H*.32),H-90);

  // Fire
  if(fire||keys.has(' ')) shoot();

  // Spawning (only during a regular wave, not during boss state)
  if(state===STATE.PLAYING && G.waveDef){
    G.spawnT-=dt;
    if(G.spawnT<=0){
      const types=G.waveDef.types||['steroid','asteroid'];
      const type=types[irand(0,types.length)];
      spawnType(type);
      const [a,b]=G.waveDef.rate;
      G.spawnT=rand(b,a)*Math.max(.45,1-G.stage*.05);
    }
    G.waveProgress+=dt;
    if(G.waveProgress>=G.waveDef.dur){
      // wave clear → advance through 5 waves, then boss
      state=STATE.CLEAR;
      advanceWaveOrBoss();
    }
  }

  // Boss update
  if(G.boss){
    updateBoss(dt);
  }

  // Bullets
  G.bullets.forEach(b=>{
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.life!==undefined){b.life-=dt}
    if(b.homing && b.target){
      const t=b.target;
      if(t && !t._dead){
        const ang=Math.atan2(t.y-b.y,t.x-b.x);
        const ca=Math.atan2(b.vy,b.vx);
        const turn=1.6*dt;
        let na=ca + clamp(((ang-ca+Math.PI*3)%TAU)-Math.PI,-turn,turn);
        const sp=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      }
    }
    if(b.trail){
      trail(b.x,b.y,b.trail);
      // Pyro Pulse bolts get a much thicker, multi-hue ember tail so the
      // weapon reads as a moving fireball rather than a colored dot.
      if(b.pyro){
        trail(b.x+rand(-4,4),b.y+rand(-2,2),'#ffd23a');
        if(Math.random()<.6) trail(b.x+rand(-3,3),b.y+rand(-2,2),'#ff3a2a');
      }
    }
  });
  G.bullets=G.bullets.filter(b=>b.y>-60 && b.y<H+80 && b.x>-60 && b.x<W+60 && (b.life===undefined||b.life>0));

  // Enemies
  G.enemies.forEach(e=>{
    e.pulse+=dt*4;
    if(e.type==='power'){
      e.y+=e.vy*dt;e.rot+=e.spin*dt;return;
    }
    if(e.type==='octopus'){
      // close range zigzag, slows near targetY
      if(e.y<e.targetY){e.vy=ENEMY_DEFS.octopus.spd}
      else{e.vy=80;e.vx=Math.sin(G.time*3+e.pulse)*120}
      e.shotT-=dt;
      if(e.shotT<=0 && G.player){
        e.shotT=rand(.9,1.7);
        const ang=Math.atan2(G.player.y-e.y,G.player.x-e.x);
        const sp=240;
        G.bullets.push({x:e.x,y:e.y+10,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5,friend:false,dmg:1,trail:'#9b3bff'});
      }
    }else if(e.type==='leech'){
      // home in on player
      if(G.player){
        const ang=Math.atan2(G.player.y-e.y,G.player.x-e.x);
        const sp=ENEMY_DEFS.leech.spd;
        e.vx+=(Math.cos(ang)*sp - e.vx)*Math.min(1,dt*2);
        e.vy+=(Math.sin(ang)*sp - e.vy)*Math.min(1,dt*2);
      }
      trail(e.x,e.y,'#ff7a3a');
    }else if(e.type==='swarmer'){
      // orbit + occasional spawn
      e.orbit+=dt*1.8;
      e.cx+=e.vx*dt*.5;e.cy+=e.vy*dt;
      e.x=e.cx+Math.cos(e.orbit)*40;
      e.y=e.cy+Math.sin(e.orbit)*22;
      e.callT-=dt;
      if(e.callT<=0){
        e.callT=rand(5,9);
        for(let i=0;i<2;i++){
          const s=ENEMY_DEFS.steroid;
          G.enemies.push({type:'steroid',x:e.x+rand(-20,20),y:e.y+rand(0,12),vx:rand(-30,30),vy:s.spd*.8,r:s.r,hp:1,maxHp:1,rot:0,spin:rand(-2,2),color:s.color,score:s.score,dmg:s.dmg,pulse:0,shotT:99});
        }
      }
    }else if(e.type==='blackfriday'){
      // bull movement, drift sideways
      e.vx=Math.sin(G.time*1.2+e.pulse)*60;
    }else if(e.type==='ufo'){
      // hovers, abducts (visual only), beam down
      if(e.y<e.targetY){e.vy=ENEMY_DEFS.ufo.spd}
      else{e.vy=0;e.vx=Math.sin(G.time*1.5+e.pulse)*70;
        e.absorb+=dt;
        if(e.absorb>2.4){
          // damage Earth more if it gets through; bullet pulse downward
          e.absorb=0;
          if(G.player){
            G.bullets.push({x:e.x,y:e.y+22,vx:0,vy:200,r:4,friend:false,dmg:1,trail:'#7dff4d'});
            G.bullets.push({x:e.x-6,y:e.y+22,vx:-40,vy:200,r:4,friend:false,dmg:1,trail:'#7dff4d'});
            G.bullets.push({x:e.x+6,y:e.y+22,vx:40,vy:200,r:4,friend:false,dmg:1,trail:'#7dff4d'});
          }
        }
      }
    }else if(e.type==='gravturret'){
      // Slow drift, occasional aimed twin shot
      e.vx=Math.sin(G.time*.8+e.pulse)*30;
      e.shotT-=dt;
      if(e.shotT<=0 && G.player && e.y>0){
        e.shotT=rand(1.4,2.2);
        const ang=Math.atan2(G.player.y-e.y,G.player.x-e.x);
        const sp=220;
        G.bullets.push({x:e.x-8,y:e.y+8,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5,friend:false,dmg:1,trail:'#cfcfcf'});
        G.bullets.push({x:e.x+8,y:e.y+8,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5,friend:false,dmg:1,trail:'#cfcfcf'});
      }
    }else if(e.type==='moonrock'){
      // Slight tumble, no shots — just heavy hazard
      e.vx=Math.sin(G.time*1.4+e.pulse)*40;
    }
    e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=e.spin*dt;
    if(e.x<24){e.x=24;e.vx=Math.abs(e.vx)}
    if(e.x>W-24){e.x=W-24;e.vx=-Math.abs(e.vx)}
  });

  // Bullet vs player → damages Earth (with invuln window)
  if(state!==STATE.OVER){
    for(let i=G.bullets.length-1;i>=0;i--){
      const b=G.bullets[i];if(b.friend)continue;
      if(d2(b,p)<(b.r+p.r)**2){
        G.bullets.splice(i,1);
        playerHit(10);
        if(G.earth<=0)break;
      }
    }
  }
  // Enemy collision with player → damages Earth AND destroys the enemy
  if(state!==STATE.OVER && G.invuln<=0){
    for(let i=G.enemies.length-1;i>=0;i--){
      const e=G.enemies[i];if(e.type==='power')continue;
      if(d2(e,p)<(e.r+p.r)**2){
        burst(e.x,e.y,e.color,20,220);
        Audio.sExplode();
        G.enemies.splice(i,1);
        playerHit(18);
        if(G.earth<=0)break;
      }
    }
    // Boss body slam: heavy boss damage + Earth hit, boss survives
    if(G.boss && G.invuln<=0){
      if(d2(G.boss,p)<(G.boss.r*.85+p.r)**2){
        const slamDmg=Math.max(8,Math.floor(G.boss.maxHp*.04));
        G.boss.hp-=slamDmg;
        flash(G.boss.x,G.boss.y,G.boss.r+10,'#ff3a5c');
        bossBarFill.style.width=Math.max(0,G.boss.hp/G.boss.maxHp*100)+'%';
        playerHit(22);
        if(G.boss && G.boss.hp<=0){endBoss();onBossDefeated()}
      }
    }
  }

  // Bullets vs enemies & boss
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.type==='power'){
      if(d2(e,p)<(e.r+p.r+8)**2){collectPower(e.kind);burst(e.x,e.y,e.color,14,160);G.enemies.splice(i,1)}
      continue;
    }
    // Off-screen gate: enemy can't be damaged until fully on-screen
    if(e.y < e.r) continue;
    // friendly bullets
    for(let j=G.bullets.length-1;j>=0;j--){
      const b=G.bullets[j];if(!b.friend)continue;
      if(d2(b,e)<(b.r+e.r)**2){
        let dmg=b.dmg||1;
        if(e.type==='ufo' && e.shieldHits>0){
          e.shieldHits--;
          flash(e.x,e.y,e.r+8,'#7dff4d');
          Audio.sShield();
          G.bullets.splice(j,1);
          break;
        }
        if(e.type==='blackfriday' && e.armored){
          // Armored: damage reduced ~40% (min 1), spark on hit
          dmg=Math.max(1,Math.ceil(dmg*.6));
          burst(b.x,b.y,'#ffd23a',3,60);
        }
        e.hp-=dmg;
        const aoe=b.aoe;const ax=b.x,ay=b.y,aR=b.aoeR,aD=b.aoeDmg,aChain=b.chainLv|0,aColor=b.aoeColor;
        G.bullets.splice(j,1);
        burst(b.x,b.y,e.color,4,70);
        Audio.sHit();
        if(e.hp<=0){
          e._dead=true;
          killEnemy(e,i);
        }
        if(aoe) applyAOE(ax,ay,aR,aD,i,false,aChain,aColor,false);
        break;
      }
    }
  }

  // Bullets vs boss
  if(G.boss){
    for(let j=G.bullets.length-1;j>=0;j--){
      const b=G.bullets[j];if(!b.friend)continue;
      if(d2(b,G.boss)<(b.r+G.boss.r*.7)**2){
        const dmg=b.dmg||1;
        G.boss.hp-=dmg;
        const aoe=b.aoe;const ax=b.x,ay=b.y,aR=b.aoeR,aD=b.aoeDmg,aChain=b.chainLv|0,aColor=b.aoeColor;
        G.bullets.splice(j,1);
        burst(b.x,b.y,G.boss.color,4,70);
        Audio.sHit();
        // Boss damage contributes to Doom charge (paused while Doom is active)
        if(G.doomActive<=0){
          G.doomCharge=Math.min(100,G.doomCharge+dmg*.2);
        }
        bossBarFill.style.width=Math.max(0,G.boss.hp/G.boss.maxHp*100)+'%';
        if(aoe) applyAOE(ax,ay,aR,aD,-1,true,aChain,aColor,false);
        // phase triggers
        for(const ph of G.boss.phases){
          if(G.boss.hp/G.boss.maxHp <= ph && !G.boss._tr?.has(ph)){
            (G.boss._tr=G.boss._tr||new Set()).add(ph);
            // spawn burst of mini octopuses
            for(let k=0;k<5;k++)spawnMinionForBoss(G.boss);
            flash(G.boss.x,G.boss.y,G.boss.r+30,G.boss.color);
            G.shake=Math.max(G.shake,8);
            G.bossPhase++;
          }
        }
        if(G.boss.hp<=0){
          endBoss();
          onBossDefeated();
        }
        break;
      }
    }
  }

  // Enemies & boss reaching Earth
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];
    if(e.y-e.r>H-54){
      if(e.type!=='power'){
        const reduction=G.shieldActive>0?.3:1;
        damageEarth(e.dmg*reduction);
        burst(e.x,H-44,G.shieldActive>0?'#22f0ff':'#ff3a5c',G.shieldActive>0?10:22,200);
      }
      G.enemies.splice(i,1);
    }
  }

  // Particles
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.02,dt);p.vy*=Math.pow(.02,dt);p.life-=dt});
  G.parts=G.parts.filter(p=>p.life>0);
  G.fxs.forEach(f=>{f.life-=dt});
  G.fxs=G.fxs.filter(f=>f.life>0);

  // Multiplier decay timer not zero auto-decay
  hud();
}

function updateBoss(dt){
  const b=G.boss;b.time+=dt;b.pulse+=dt*3;
  // drift to anchor then sway
  if(b.y<b.ty){b.vy=b.spd*1.4;b.vx=0}
  else{
    b.vy=Math.sin(b.time*.7)*8;
    b.vx=Math.sin(b.time*.9)*b.spd*1.5;
  }
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  b.x=clamp(b.x,b.r+10,W-b.r-10);
  // shooting
  b.shootT-=dt;
  if(b.shootT<=0){
    b.shootT=b.shootEvery;
    bossAttack(b);
  }
  // minion every N
  b.minionT-=dt;
  if(b.minionT<=0){
    b.minionT=b.minionEvery;
    spawnMinionForBoss(b);
  }
}
function bossAttack(b){
  const p=G.player;if(!p)return;
  if(b.kind==='squirt'){
    // 3-shot inky spread
    for(let i=-1;i<=1;i++){
      const ang=Math.atan2(p.y-b.y,p.x-b.x)+i*.18;
      G.bullets.push({x:b.x,y:b.y+10,vx:Math.cos(ang)*230,vy:Math.sin(ang)*230,r:6,friend:false,dmg:1,trail:'#9b3bff'});
    }
  }else if(b.kind==='grav'){
    // heavy bursts straight down
    for(let i=0;i<4;i++){
      G.bullets.push({x:b.x+rand(-30,30),y:b.y+10,vx:rand(-40,40),vy:280+rand(0,60),r:5,friend:false,dmg:1,trail:'#a0a0a0'});
    }
  }else if(b.kind==='tentaclon'){
    // ink wall: row of slow projectiles
    for(let x=20;x<W-20;x+=42){
      G.bullets.push({x,y:b.y+30,vx:0,vy:170,r:5,friend:false,dmg:1,trail:'#7b1fa2'});
    }
  }else if(b.kind==='mothership'){
    // multiple weakpoints fire pink plasma
    for(let i=-2;i<=2;i++){
      G.bullets.push({x:b.x+i*22,y:b.y+30,vx:i*40,vy:240,r:5,friend:false,dmg:1,trail:'#ff2bd6'});
    }
  }else if(b.kind==='moon'){
    // mood swing: alternate moon rocks and laser eyes
    const mood=Math.floor(b.time/3)%2;
    if(mood===0){
      // rocks (arc shots)
      for(let i=0;i<3;i++){
        const ang=Math.atan2(p.y-b.y,p.x-b.x)+rand(-.4,.4);
        G.bullets.push({x:b.x+rand(-40,40),y:b.y+10,vx:Math.cos(ang)*210,vy:Math.sin(ang)*210,r:7,friend:false,dmg:1,trail:'#dcd2c4'});
      }
    }else{
      // laser eyes — fast tracking line
      const ang=Math.atan2(p.y-b.y,p.x-b.x);
      G.bullets.push({x:b.x-20,y:b.y+10,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,r:4,friend:false,dmg:1,trail:'#ff2bd6'});
      G.bullets.push({x:b.x+20,y:b.y+10,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,r:4,friend:false,dmg:1,trail:'#ff2bd6'});
    }
  }else if(b.kind==='kraken'){
    // tentacle sweep
    for(let i=-3;i<=3;i++){
      G.bullets.push({x:b.x+i*18,y:b.y+30,vx:i*70,vy:220,r:6,friend:false,dmg:1,trail:'#7a35cf'});
    }
  }
}

function killEnemy(e,i){
  G.score+=Math.floor(e.score*G.multi);
  G.kills++;
  G.killsThisStage++;
  G.multi=Math.min(8, G.multi+.15);
  G.multiTimer=3.2;
  const tough=e.dmg>=14;
  // Doom Squadron charge — paused while active so it can't chain
  if(G.doomActive<=0){
    G.doomCharge=Math.min(100,G.doomCharge+(tough?1.8:1.1));
  }
  // Weapon drop scheduler — exactly 12 per stage, distributed across kills
  const dropEvery=8; // kills per scheduled drop (covers 96 kills for 12 drops)
  if(G.weaponDropsThisStage<12 && G.killsThisStage>=dropEvery*(G.weaponDropsThisStage+1)){
    G.weaponDropsThisStage++;
    forceWeaponDrop(e.x,e.y);
  }
  // Earthquake Bomb (rare super) — never during boss, single instance only
  if(rollQuakeBombDrop(e)){
    spawnQuakeBomb(e.x,e.y);
  }
  // explosion variations
  if(e.type==='steroid'){
    // explodes, releases pink plasma bullets in 6 directions
    for(let k=0;k<6;k++){
      const ang=(k/6)*TAU;
      G.bullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*210,vy:Math.sin(ang)*210,r:4,friend:false,dmg:1,trail:'#ff2bd6'});
    }
    burst(e.x,e.y,'#ff2bd6',26,260,.9);
    Audio.sExplode();
  }else if(e.type==='blackfriday'){
    // debris explosion (no damage but obstructs)
    burst(e.x,e.y,'#ff3a5c',32,280,1.0);
    flash(e.x,e.y,e.r+10,'#ff3a5c');
    spawnPower(e.x,e.y,.25); // higher chance to drop power
    Audio.sExplode();
  }else if(e.type==='ufo'){
    burst(e.x,e.y,'#7dff4d',30,280,1.0);
    flash(e.x,e.y,e.r+12,'#7dff4d');
    spawnPower(e.x,e.y,.15);
    Audio.sExplode();
  }else{
    burst(e.x,e.y,e.color,e.type==='octopus'?22:14,e.type==='leech'?240:160,.7);
    spawnPower(e.x,e.y);
  }
  G.enemies.splice(i,1);
}

// Earth is the only HP. Game over when it hits 0.
function damageEarth(dmg){
  if(dmg<=0)return;
  G.earth-=dmg;
  G.multi=1;G.multiTimer=0;
  G.shake=Math.max(G.shake,8);
  if(G.earth<=0){
    G.earth=0;
    gameOver();
  }
}
// Player gets hit: invuln window prevents instant Earth drain from chained hits.
// Starshield active absorbs the hit; otherwise Earth takes damage with feedback.
function playerHit(dmg){
  if(G.invuln>0)return;
  if(G.shieldActive>0){
    G.shieldActive=Math.max(0,G.shieldActive-1.5);
    G.shake=Math.max(G.shake,6);
    burst(G.player.x,G.player.y,'#22f0ff',14,150);
    Audio.sShield();
    G.invuln=.6;
    return;
  }
  G.invuln=1.2;
  G.shake=Math.max(G.shake,14);
  G.multi=1;G.multiTimer=0;
  burst(G.player.x,G.player.y,'#ff3a5c',24,260,1.0);
  flash(G.player.x,G.player.y,40,'#ff3a5c');
  Audio.sExplode();
  toastMsg('SHIP HIT! · EARTH '+Math.max(0,Math.ceil(G.earth-dmg))+'%',1100);
  damageEarth(dmg);
}

// ---------- Shooting / Weapons ----------
function shoot(){
  if(G.fireCd>0)return;
  const p=G.player;

  // ── Earthquake Bomb (rare temporary pickup) overrides the equipped weapon.
  // Fixed cd, ignores rapid/doom multipliers, and skips wingmen so the screen
  // isn't muddied by little pew bullets next to the catastrophic blast.
  if(G.bombShots>0){
    fireBombShot(p);
    G.bombShots--;
    G.fireCd=.5;
    if(G.bombShots<=0)toastMsg('BOMB DEPLETED',1100);
    return;
  }

  const rapid=G.rapid>0;
  const doom=G.doomActive>0;
  const lv=G.weaponLv;
  let cd;
  if(G.weapon==='pew'){
    // Slightly slower than before so it's a starter, not a dominant gun.
    cd=rapid?.07:.16;
    if(doom)cd*=.4;
    G.bullets.push({x:p.x,y:p.y-22,vx:0,vy:-680,r:4,friend:true,dmg:1});
    if(rapid||lv>=2){
      G.bullets.push({x:p.x-12,y:p.y-16,vx:-50,vy:-640,r:3.5,friend:true,dmg:1});
      G.bullets.push({x:p.x+12,y:p.y-16,vx:50,vy:-640,r:3.5,friend:true,dmg:1});
    }
    if(lv>=3){
      G.bullets.push({x:p.x-20,y:p.y-10,vx:-110,vy:-560,r:3.2,friend:true,dmg:1});
      G.bullets.push({x:p.x+20,y:p.y-10,vx:110,vy:-560,r:3.2,friend:true,dmg:1});
    }
    Audio.sShoot();
  }else if(G.weapon==='laser'){
    cd=rapid?.08:.18;
    if(doom)cd*=.4;
    // Damage trimmed by 1 across the board; behavior + feel unchanged.
    G.bullets.push({x:p.x,y:p.y-24,vx:0,vy:-900,r:3,friend:true,dmg:1+lv,trail:'#22f0ff'});
    if(lv>=2){
      G.bullets.push({x:p.x-8,y:p.y-20,vx:0,vy:-880,r:2.5,friend:true,dmg:lv,trail:'#22f0ff'});
      G.bullets.push({x:p.x+8,y:p.y-20,vx:0,vy:-880,r:2.5,friend:true,dmg:lv,trail:'#22f0ff'});
    }
    Audio.sLaser();
  }else if(G.weapon==='missiles'){
    cd=rapid?.18:.32;
    if(doom)cd*=.4;
    // Find nearest enemy targets. Per-shot dmg dropped to 1 and turn rate
    // (in the bullet update loop) lowered from 2.2 to 1.6 — still fun, less
    // dominant.
    const targets=[...G.enemies.filter(e=>e.type!=='power'),...(G.boss?[G.boss]:[])];
    targets.sort((a,b)=>d2(p,a)-d2(p,b));
    const fires=lv+1;
    for(let i=0;i<fires;i++){
      const t=targets[i%Math.max(1,targets.length)];
      const ang=t?Math.atan2(t.y-p.y,t.x-p.x):(-Math.PI/2);
      const sp=520;
      G.bullets.push({x:p.x+(i-fires/2)*8,y:p.y-14,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5,friend:true,dmg:1,trail:'#ff7a3a',homing:true,target:t,life:2.5});
    }
    Audio.sMissile();
  }else if(G.weapon==='pyro'){
    // Final progression weapon. Splash-focused plasma bombs — direct hit
    // is modest, but the AOE is the real damage and matches direct dmg
    // 1:1 so you watch fire spread across whatever the bolt touches.
    // L3 chains: kills splashed by the blast spawn a smaller secondary
    // pulse at that enemy's position (bounded recursion).
    const cdN=[.35,.30,.25][lv-1];
    const cdR=[.25,.20,.18][lv-1];
    cd=rapid?cdR:cdN;
    if(doom)cd*=.5;
    const baseDmg=2+lv;            // 3 / 4 / 5
    const aoeR=58+lv*24;           // 82 / 106 / 130 px (was 72 / 94 / 116)
    const aoeDmg=baseDmg;          // splash = direct: AOE is the identity
    const chainLv=lv>=3?1:0;
    G.bullets.push({
      x:p.x,y:p.y-22,vx:0,vy:-560,r:9,
      friend:true,dmg:baseDmg,trail:'#ff5a3a',life:1.8,
      aoe:true,aoeR,aoeDmg,chainLv,aoeColor:'#ff5a3a',pyro:true
    });
    G.shake=Math.max(G.shake,3);
    Audio.sPyro();
  }else{cd=.14}

  // Doom Squadron wingmen flank the player and fire in sync
  if(doom){
    const wx=44;
    G.bullets.push({x:p.x-wx,y:p.y-8,vx:0,vy:-680,r:4,friend:true,dmg:1,trail:'#ff2bd6'});
    G.bullets.push({x:p.x+wx,y:p.y-8,vx:0,vy:-680,r:4,friend:true,dmg:1,trail:'#22f0ff'});
  }
  // Floor: doom + rapid stacking can otherwise drive cd into single-frame
  // territory and flood bullet/audio allocations until the phone GC chokes.
  G.fireCd=Math.max(.06,cd);
  if(G.bullets.length>240){
    G.bullets.splice(0, G.bullets.length-240);
  }
}

// Single Earthquake Bomb shot — massive direct damage, huge AOE, big shake.
// Uses the standard applyAOE pipeline via the bullet's aoe/aoeR/aoeDmg fields.
function fireBombShot(p){
  G.bullets.push({
    x:p.x,y:p.y-26,vx:0,vy:-540,r:14,
    friend:true,dmg:25,trail:'#ffd23a',life:2.4,
    aoe:true,aoeR:200,aoeDmg:18,chainLv:0,aoeColor:'#ffd23a'
  });
  G.shake=Math.max(G.shake,12);
  Audio.sQuake();
  Audio.sExplode();
}

// Render Hank (left) + Tank (right) wingmen during Doom Squadron
function drawWingmen(){
  if(G.doomActive<=0||!G.player)return;
  const p=G.player;
  const t=G.time;
  drawWing(p.x-46+Math.sin(t*4)*2, p.y+4+Math.sin(t*5)*1.5, ASSETS.ship_hank, '#ff2bd6','#9b3bff','H');
  drawWing(p.x+46+Math.cos(t*4)*2, p.y+4+Math.cos(t*5)*1.5, ASSETS.ship_tank, '#22f0ff','#1a6080','T');
}
function drawWing(x,y,img,c1,c2,initial){
  ctx.save();ctx.translate(x,y);
  if(img){
    const w=52,h=52;
    ctx.drawImage(img,-w/2,-h/2,w,h);
  }else{
    ctx.beginPath();
    ctx.moveTo(-6,11);ctx.lineTo(0,22+Math.sin(G.time*40)*3);ctx.lineTo(6,11);
    ctx.fillStyle=c1;ctx.globalAlpha=.8;ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.moveTo(0,-18);ctx.lineTo(13,13);ctx.lineTo(5,7);ctx.lineTo(0,12);ctx.lineTo(-5,7);ctx.lineTo(-13,13);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,-18,0,16);
    g.addColorStop(0,'#fff');g.addColorStop(.55,c1);g.addColorStop(1,c2);
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,-5,3.2,6,0,0,TAU);ctx.fillStyle='#0a0014';ctx.fill();
    ctx.strokeStyle=c1;ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 8px Impact';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(initial,0,5);
  }
  ctx.restore();
}

// ---------- Yeet (once per stage; locked out during boss fights) ----------
function planetaryYeet(){
  if(state!==STATE.PLAYING)return;       // bosses are off-limits
  if(G.boss)return;
  if(!G.yeetAvailable)return;
  G.yeetAvailable=false;
  yeetBtn.disabled=true;yeetBtn.classList.remove('ready');
  // visual: spawn a giant planet sweep
  G.fxs.push({type:'yeet',x:-200,y:H*.45,vx:1400,r:Math.max(W,H)*.6,life:1.4,max:1.4,color:'#22f0ff'});
  G.shake=Math.max(G.shake,16);
  shockwave(W/2,H/2);
  Audio.sYeet();
  // Clear all normal enemies and projectiles on screen (boss is unreachable here)
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];if(e.type==='power')continue;
    burst(e.x,e.y,e.color,16,200);
    G.score+=Math.floor(e.score*.4*G.multi);
    G.kills++;
    G.enemies.splice(i,1);
  }
  // Clear hostile bullets
  G.bullets=G.bullets.filter(b=>b.friend);
  toastMsg('PLANETARY YEET');
}

// ---------- Doom Squadron ----------
function tryDoomSquadron(){
  if(state!==STATE.PLAYING && state!==STATE.BOSS)return;
  if(G.doomCharge<100||G.doomActive>0)return;
  G.doomCharge=0;
  G.doomActive=30;
  doomBtn.disabled=true;
  doomBtn.classList.remove('ready');
  doomBtn.classList.add('active');
  doomTimerEl.textContent='30';
  Audio.startDoom();
  toastMsg('DOOM SQUADRON ONLINE',1600);
}

// ---------- HUD ----------
function hud(){
  scoreEl.textContent=Math.floor(G.score).toLocaleString();
  multiEl.textContent='x'+G.multi.toFixed(G.multi>=2?1:0);
  multiEl.style.color=G.multi>=4?'#ff2bd6':G.multi>=2?'#ffd23a':'#7dff4d';
  const earthPct=Math.max(0,Math.ceil(G.earth));
  livesEl.textContent='EARTH '+earthPct+'%';
  livesEl.style.color=earthPct<=25?'#ff3a5c':earthPct<=55?'#ffd23a':'#22f0ff';
  if(G.waveDef && !G.boss){
    waveNameEl.textContent=G.waveDef.name;
  }
  // Weapon indicator: show the temp Earthquake Bomb counter when active,
  // otherwise the equipped progression weapon. Skip the DOM write if the
  // text hasn't changed to keep this hot-path cheap.
  let want, wantColor;
  if(G.bombShots>0){
    want='⚠ EARTHQUAKE BOMB · '+G.bombShots+'/5';
    wantColor='#ff7a3a';
  }else{
    want=WEAPON_NAMES[G.weapon]+(G.weaponLv>1?' LV'+G.weaponLv:'');
    wantColor='';
  }
  if(weaponInd.textContent!==want)weaponInd.textContent=want;
  if(weaponInd.style.color!==wantColor)weaponInd.style.color=wantColor;
}

// ---------- Drawing ----------
function drawBG(){
  // Scrolling starfield image (two copies stacked, scroll downward, parallax)
  ctx.fillStyle='#02000a';
  ctx.fillRect(0,0,W,H);
  const sf=ASSETS.starfield;
  if(sf){
    // Compute tile size keeping aspect to W
    const tw=W, th=tw * (sf.naturalHeight/sf.naturalWidth);
    const o1=(G.starOff2 % th);
    for(let y=-th+o1;y<H+th;y+=th){
      ctx.drawImage(sf,0,y,tw,th);
    }
    // Faster parallax layer with transparency
    ctx.globalAlpha=.35;
    const tw2=W*1.4, th2=tw2*(sf.naturalHeight/sf.naturalWidth);
    const o2=(G.starOff % th2);
    for(let y=-th2+o2;y<H+th2;y+=th2){
      ctx.drawImage(sf,(W-tw2)/2,y,tw2,th2);
    }
    ctx.globalAlpha=1;
  }else{
    // Procedural fallback: stars
    ctx.fillStyle='#fff';
    for(let i=0;i<80;i++){
      const x=(i*97+G.starOff)%W;
      const y=(i*53+G.starOff2*2)%H;
      ctx.globalAlpha=.4;ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;
  }
  // neon grid scan lines toward Earth
  ctx.save();
  ctx.globalAlpha=.15;
  ctx.strokeStyle='#ff2bd6';ctx.lineWidth=1;
  for(let x=-W;x<W*2;x+=48){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x+W*.4,H);
    ctx.stroke();
  }
  ctx.restore();
}

function drawEarth(){
  const y=H+34,r=Math.max(W*.85,260);
  ctx.beginPath();ctx.arc(W/2,y,r,Math.PI,0);
  const g=ctx.createRadialGradient(W/2,y-r*.2,r*.1,W/2,y,r);
  g.addColorStop(0,'#4af2bf');
  g.addColorStop(.36,'#2c8cff');
  g.addColorStop(1,'#0b2d6d');
  ctx.fillStyle=g;ctx.fill();
  // continent silhouettes
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#0a3b22';
  ctx.beginPath();ctx.ellipse(W/2-r*.35,y-r*.4,r*.18,r*.08,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(W/2+r*.2,y-r*.5,r*.14,r*.06,.4,0,TAU);ctx.fill();
  ctx.restore();
  // earth ring
  ctx.beginPath();ctx.arc(W/2,y,r,Math.PI,0);
  ctx.strokeStyle='rgba(34,240,255,.4)';ctx.lineWidth=2;ctx.stroke();
  if(G.shieldActive>0){
    ctx.beginPath();ctx.arc(W/2,y,r+10+Math.sin(G.time*8)*4,Math.PI,0);
    ctx.strokeStyle='rgba(34,240,255,.85)';ctx.lineWidth=5;ctx.stroke();
  }
  // damaged red glow as earth drops
  if(G.earth<60){
    ctx.beginPath();ctx.arc(W/2,y,r+6,Math.PI,0);
    ctx.strokeStyle=`rgba(255,58,92,${(60-G.earth)/60*.6})`;
    ctx.lineWidth=8;ctx.stroke();
  }
}

function drawShip(){
  const p=G.player;if(!p)return;
  const isCyn=G.character==='cynthia';
  // Invulnerability blink — skip every other ~80ms frame
  if(G.invuln>0 && Math.floor(G.time*12)%2===0)return;
  ctx.save();ctx.translate(p.x,p.y);
  const img=isCyn?ASSETS.ship_cynthia:ASSETS.ship_moore;
  if(img){
    // bob slightly with the engine flame rhythm baked into the sprite
    const w=64,h=64;
    // tint glow under the sprite for Doom Squadron / rapid fire feedback
    if(G.doomActive>0||G.rapid>0){
      ctx.save();
      ctx.globalAlpha=.45+.2*Math.sin(G.time*12);
      ctx.fillStyle=G.doomActive>0?'#ff2bd6':'#ffd23a';
      ctx.beginPath();ctx.ellipse(0,18,w*.3,h*.2,0,0,TAU);ctx.fill();
      ctx.restore();
    }
    ctx.drawImage(img,-w/2,-h/2,w,h);
  }else{
    // Procedural fallback if the sprite didn't load
    ctx.beginPath();
    ctx.moveTo(-9,16);ctx.lineTo(0,30+Math.sin(G.time*42)*5);ctx.lineTo(9,16);
    ctx.fillStyle=G.rapid>0?'#ffd23a':(G.doomActive>0?'#ff2bd6':isCyn?'#ff7adf':'#22f0ff');
    ctx.globalAlpha=.85;ctx.fill();ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.moveTo(0,-26);ctx.lineTo(18,18);ctx.lineTo(7,10);ctx.lineTo(0,16);ctx.lineTo(-7,10);ctx.lineTo(-18,18);
    ctx.closePath();
    const g=ctx.createLinearGradient(0,-26,0,22);
    if(isCyn){g.addColorStop(0,'#fff');g.addColorStop(.5,'#ff7adf');g.addColorStop(1,'#7a2a8a')}
    else{g.addColorStop(0,'#fff');g.addColorStop(.5,'#7dff4d');g.addColorStop(1,'#1a5a14')}
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,-8,5,9,0,0,TAU);ctx.fillStyle='#071324';ctx.fill();
    ctx.strokeStyle=isCyn?'#ff2bd6':'#7dff4d';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(0,-34);ctx.strokeStyle='#ff2bd6';ctx.lineWidth=3;ctx.stroke();
  }
  // Shield ring stays on top
  if(G.shieldActive>0){
    ctx.beginPath();ctx.arc(0,0,34+Math.sin(G.time*8)*2,0,TAU);
    ctx.strokeStyle='rgba(34,240,255,.85)';ctx.lineWidth=3;ctx.stroke();
  }
  ctx.restore();
}

// Enemy renderers
function drawEnemy(e){
  if(e.type==='power'){drawPower(e);return}
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  switch(e.type){
    case 'steroid':{
      // pink canister
      const w=e.r*1.0,h=e.r*1.8;
      ctx.fillStyle='#ff2bd6';
      ctx.strokeStyle='#ffd6f2';ctx.lineWidth=2;
      ctx.fillRect(-w/2,-h/2,w,h);
      ctx.strokeRect(-w/2,-h/2,w,h);
      ctx.fillStyle='#fff';ctx.fillRect(-w/3,-h/3,w*.66,h*.4);
      ctx.fillStyle='#9b3bff';ctx.fillRect(-w/3,h/4,w*.66,h*.12);
      // glow pulse
      ctx.globalAlpha=.4+.4*Math.sin(e.pulse*3);
      ctx.strokeStyle='#ff77e4';ctx.lineWidth=3;
      ctx.strokeRect(-w/2-3,-h/2-3,w+6,h+6);
      break;
    }
    case 'asteroid':{
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=i/10*TAU,r=e.r*(.72+.34*Math.sin(i*2.1+e.pulse));
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
      }
      ctx.closePath();
      ctx.fillStyle='#7e6b5b';ctx.fill();
      ctx.strokeStyle='#d2b896';ctx.lineWidth=2;ctx.stroke();
      break;
    }
    case 'comet':{
      ctx.rotate(-e.rot);
      ctx.beginPath();ctx.moveTo(0,-e.r*.7);
      ctx.quadraticCurveTo(-e.r*2.4,-e.r*.2,-e.r*3.7,-e.r*.9);
      ctx.quadraticCurveTo(-e.r*2.1,e.r*.6,0,e.r*.8);
      ctx.fillStyle='rgba(122,236,255,.25)';ctx.fill();
      ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);
      ctx.fillStyle='#dbfbff';ctx.fill();
      ctx.strokeStyle='#78e7ff';ctx.lineWidth=3;ctx.stroke();
      break;
    }
    case 'octopus':{
      drawOctopus(e.r,e.color,e.pulse);
      break;
    }
    case 'leech':{
      // fiery comet with face
      ctx.beginPath();
      for(let i=0;i<7;i++){
        const a=i/7*TAU,r=e.r*(.8+.2*Math.sin(i+e.pulse));
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
      }
      ctx.closePath();
      const g=ctx.createRadialGradient(0,0,2,0,0,e.r*1.2);
      g.addColorStop(0,'#ffe17a');g.addColorStop(.5,'#ff7a3a');g.addColorStop(1,'#7a1a00');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#ffd23a';ctx.lineWidth=2;ctx.stroke();
      // teeth
      ctx.fillStyle='#fff';ctx.fillRect(-e.r*.3,e.r*.1,e.r*.6,e.r*.18);
      ctx.fillStyle='#ff3a5c';ctx.fillRect(-e.r*.15,e.r*.12,e.r*.3,e.r*.14);
      break;
    }
    case 'swarmer':{
      // satellite: central box, 2 solar panels, antenna
      ctx.fillStyle='#cfcfcf';
      ctx.fillRect(-e.r*.4,-e.r*.5,e.r*.8,e.r);
      ctx.strokeStyle='#888';ctx.lineWidth=2;
      ctx.strokeRect(-e.r*.4,-e.r*.5,e.r*.8,e.r);
      // panels
      ctx.fillStyle='#22f0ff';
      ctx.fillRect(-e.r*1.5,-e.r*.4,e.r*1.0,e.r*.8);
      ctx.fillRect(e.r*.5,-e.r*.4,e.r*1.0,e.r*.8);
      // grid
      ctx.strokeStyle='rgba(0,0,0,.4)';
      for(let i=1;i<4;i++){
        ctx.beginPath();ctx.moveTo(-e.r*1.5+i*e.r*.25,-e.r*.4);ctx.lineTo(-e.r*1.5+i*e.r*.25,e.r*.4);ctx.stroke();
        ctx.beginPath();ctx.moveTo(e.r*.5+i*e.r*.25,-e.r*.4);ctx.lineTo(e.r*.5+i*e.r*.25,e.r*.4);ctx.stroke();
      }
      // antenna
      ctx.strokeStyle='#ff2bd6';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,-e.r*.5);ctx.lineTo(0,-e.r*1.1);ctx.stroke();
      ctx.beginPath();ctx.arc(0,-e.r*1.2,e.r*.15,0,TAU);ctx.fillStyle='#ff2bd6';ctx.fill();
      break;
    }
    case 'blackfriday':{
      // chunky red discount robot
      ctx.fillStyle='#ff3a5c';
      ctx.fillRect(-e.r*.9,-e.r*.7,e.r*1.8,e.r*1.4);
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.strokeRect(-e.r*.9,-e.r*.7,e.r*1.8,e.r*1.4);
      // SALE text
      ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(e.r*.6)+'px Impact';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('SALE',0,-e.r*.15);
      ctx.font='bold '+Math.floor(e.r*.36)+'px Impact';
      ctx.fillText('-90%',0,e.r*.32);
      // eyes
      ctx.fillStyle='#ffd23a';
      ctx.beginPath();ctx.arc(-e.r*.4,-e.r*.5,e.r*.12,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*.4,-e.r*.5,e.r*.12,0,TAU);ctx.fill();
      break;
    }
    case 'ufo':{
      // saucer with green tractor beam
      ctx.fillStyle='#2a2a3a';
      ctx.beginPath();ctx.ellipse(0,0,e.r*1.4,e.r*.5,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#9b3bff';ctx.lineWidth=2;ctx.stroke();
      // dome
      ctx.beginPath();ctx.arc(0,-e.r*.2,e.r*.55,Math.PI,0);
      const g=ctx.createLinearGradient(0,-e.r*.7,0,0);
      g.addColorStop(0,'#9ffcff');g.addColorStop(1,'#22f0ff');
      ctx.fillStyle=g;ctx.fill();
      // lights
      for(let i=-2;i<=2;i++){
        ctx.beginPath();ctx.arc(i*e.r*.4,e.r*.05,e.r*.08,0,TAU);
        ctx.fillStyle=i%2?'#ffd23a':'#ff2bd6';ctx.fill();
      }
      // tractor beam
      ctx.globalAlpha=.35+.15*Math.sin(e.pulse*3);
      ctx.beginPath();
      ctx.moveTo(-e.r*.6,e.r*.2);ctx.lineTo(-e.r*1.1,e.r*2.2);
      ctx.lineTo(e.r*1.1,e.r*2.2);ctx.lineTo(e.r*.6,e.r*.2);ctx.closePath();
      ctx.fillStyle='#7dff4d';ctx.fill();
      ctx.globalAlpha=1;
      // shield ring if shieldHits>0
      if(e.shieldHits>0){
        ctx.globalAlpha=.4;
        ctx.beginPath();ctx.ellipse(0,0,e.r*1.6,e.r*.7,0,0,TAU);
        ctx.strokeStyle='#7dff4d';ctx.lineWidth=3;ctx.stroke();
        ctx.globalAlpha=1;
      }
      break;
    }
    case 'gravturret':{
      // Mini grav-turret enemy: gray dish with twin cannons + red core
      ctx.fillStyle='#3a3a4a';
      ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fill();
      ctx.strokeStyle='#cfcfcf';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#222';
      ctx.fillRect(-e.r*.45,e.r*.05,e.r*.18,e.r*.7);
      ctx.fillRect( e.r*.27,e.r*.05,e.r*.18,e.r*.7);
      ctx.fillStyle='#ff3a5c';
      ctx.fillRect(-e.r*.43,e.r*.6,e.r*.14,e.r*.18);
      ctx.fillRect( e.r*.29,e.r*.6,e.r*.14,e.r*.18);
      ctx.beginPath();ctx.arc(0,0,e.r*.3+Math.sin(e.pulse*3)*2,0,TAU);
      ctx.fillStyle='rgba(255,58,92,.65)';ctx.fill();
      break;
    }
    case 'moonrock':{
      // Pock-marked grey chunk
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a=i/10*TAU,r=e.r*(.78+.28*Math.sin(i*2.4+e.pulse));
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
      }
      ctx.closePath();
      const g=ctx.createRadialGradient(-e.r*.2,-e.r*.3,2,0,0,e.r);
      g.addColorStop(0,'#f4eed8');g.addColorStop(.5,'#cfc8b5');g.addColorStop(1,'#5f5848');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#9a8f78';ctx.lineWidth=2;ctx.stroke();
      // craters
      ctx.fillStyle='rgba(40,32,20,.4)';
      ctx.beginPath();ctx.arc(-e.r*.3,-e.r*.15,e.r*.18,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*.2,e.r*.25,e.r*.14,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(e.r*.35,-e.r*.3,e.r*.08,0,TAU);ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawOctopus(r,color,pulse){
  // body
  ctx.beginPath();ctx.arc(0,-r*.15,r*.85,0,TAU);
  const g=ctx.createRadialGradient(-r*.2,-r*.3,2,0,0,r);
  g.addColorStop(0,'#ffaaff');
  g.addColorStop(.5,color);
  g.addColorStop(1,'#2a0040');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#ff2bd6';ctx.lineWidth=2;ctx.stroke();
  // eyes (white with red pupils)
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-r*.25,-r*.2,r*.18,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(r*.25,-r*.2,r*.18,0,TAU);ctx.fill();
  ctx.fillStyle='#ff3a5c';
  ctx.beginPath();ctx.arc(-r*.22,-r*.2,r*.08,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(r*.28,-r*.2,r*.08,0,TAU);ctx.fill();
  // tentacles
  ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,r*.18);
  for(let i=0;i<6;i++){
    const a=(i/5)*Math.PI*1.2-Math.PI*.1+Math.PI*.5;
    const swing=Math.sin(pulse*1.4+i)*.4;
    ctx.beginPath();
    const sx=Math.cos(a-Math.PI*.5)*r*.7;
    const sy=Math.sin(a-Math.PI*.5)*r*.4+r*.2;
    ctx.moveTo(sx,sy);
    ctx.quadraticCurveTo(sx*1.4+swing*r*.3,r*.6,sx*1.6+swing*r*.5,r*1.2);
    ctx.stroke();
  }
}

function drawPower(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(-e.rot);
  // Aggressive double-pulse halo for the rare bomb pickup so the player
  // immediately spots one onscreen.
  const isBomb=e.kind==='quakebomb';
  if(isBomb){
    ctx.beginPath();ctx.arc(0,0,e.r+8+Math.sin(G.time*9)*4,0,TAU);
    ctx.fillStyle=e.color;ctx.globalAlpha=.16;ctx.fill();ctx.globalAlpha=1;
  }
  ctx.beginPath();ctx.arc(0,0,e.r+Math.sin(G.time*7)*2,0,TAU);
  ctx.fillStyle=e.color;ctx.globalAlpha=.18;ctx.fill();ctx.globalAlpha=1;
  ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);
  ctx.fillStyle='#10172f';ctx.fill();
  ctx.strokeStyle=e.color;ctx.lineWidth=isBomb?4:3;ctx.stroke();
  ctx.fillStyle=e.color;
  ctx.font='bold '+(isBomb?18:14)+'px Impact';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const c={repair:'+',rapid:'R',shield:'S',weapon:'W',quakebomb:'!'}[e.kind]||'?';
  ctx.fillText(c,0,1);
  ctx.restore();
}

// Boss rendering
function drawBoss(){
  const b=G.boss;if(!b)return;
  ctx.save();ctx.translate(b.x,b.y);
  if(b.kind==='squirt' || b.kind==='tentaclon' || b.kind==='kraken'){
    drawOctopus(b.r,b.color,b.pulse);
    // bigger eyes for boss flair
  }else if(b.kind==='grav'){
    // turret base + cannon
    ctx.fillStyle='#3a3a4a';
    ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();
    ctx.strokeStyle='#cfcfcf';ctx.lineWidth=3;ctx.stroke();
    // cannons
    for(let i=-1;i<=1;i++){
      ctx.fillStyle='#222';
      ctx.fillRect(i*b.r*.4-b.r*.1,b.r*.1,b.r*.2,b.r*.7);
      ctx.fillStyle='#ff3a5c';
      ctx.fillRect(i*b.r*.4-b.r*.08,b.r*.6,b.r*.16,b.r*.2);
    }
    // glow center
    ctx.beginPath();ctx.arc(0,0,b.r*.3+Math.sin(b.pulse*3)*4,0,TAU);
    ctx.fillStyle='rgba(255,58,92,.6)';ctx.fill();
  }else if(b.kind==='mothership'){
    // big steroid canister mothership
    const w=b.r*2.2,h=b.r*1.6;
    ctx.fillStyle='#ff2bd6';
    ctx.fillRect(-w/2,-h/2,w,h);
    ctx.strokeStyle='#ffd6f2';ctx.lineWidth=3;
    ctx.strokeRect(-w/2,-h/2,w,h);
    ctx.fillStyle='#fff';ctx.fillRect(-w/3,-h/3,w*.66,h*.45);
    ctx.fillStyle='#9b3bff';ctx.fillRect(-w/3,h/6,w*.66,h*.15);
    // weakpoints (glowing nodes)
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.arc(i*w*.3,h*.3,b.r*.13,0,TAU);
      ctx.fillStyle='#ffd23a';ctx.fill();
      ctx.beginPath();ctx.arc(i*w*.3,h*.3,b.r*.18+Math.sin(b.pulse*3+i)*2,0,TAU);
      ctx.strokeStyle='#ffd23a';ctx.lineWidth=2;ctx.stroke();
    }
    // phase 2 armor shed: cracks
    if(b.hp/b.maxHp<.5){
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(-w*.2,-h*.4);ctx.lineTo(-w*.1,0);ctx.lineTo(-w*.3,h*.3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(w*.1,-h*.4);ctx.lineTo(w*.25,0);ctx.lineTo(w*.05,h*.3);ctx.stroke();
    }
  }else if(b.kind==='moon'){
    // The Moon!
    ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);
    const g=ctx.createRadialGradient(-b.r*.3,-b.r*.3,b.r*.1,0,0,b.r);
    g.addColorStop(0,'#fffaee');g.addColorStop(.5,'#dcd2c4');g.addColorStop(1,'#6e6450');
    ctx.fillStyle=g;ctx.fill();
    // craters
    ctx.fillStyle='rgba(60,55,40,.5)';
    [[-b.r*.4,-b.r*.2,b.r*.18],[b.r*.3,-b.r*.4,b.r*.12],[b.r*.1,b.r*.3,b.r*.2],[-b.r*.2,b.r*.4,b.r*.1]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,TAU);ctx.fill()});
    // mood face: rotates through angry/sad/happy by hp
    const mood=Math.floor(b.time/3)%3;
    ctx.fillStyle='#0a0014';
    // eyes
    ctx.beginPath();ctx.arc(-b.r*.3,-b.r*.05,b.r*.07,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(b.r*.3,-b.r*.05,b.r*.07,0,TAU);ctx.fill();
    // mouth
    ctx.strokeStyle='#0a0014';ctx.lineWidth=4;
    ctx.beginPath();
    if(mood===0){ctx.moveTo(-b.r*.25,b.r*.3);ctx.quadraticCurveTo(0,b.r*.1,b.r*.25,b.r*.3)} // frown
    else if(mood===1){ctx.moveTo(-b.r*.25,b.r*.2);ctx.lineTo(b.r*.25,b.r*.2)} // flat
    else{ctx.moveTo(-b.r*.25,b.r*.2);ctx.quadraticCurveTo(0,b.r*.4,b.r*.25,b.r*.2)} // smile
    ctx.stroke();
    // laser eye glow when in laser mood
    const lm=Math.floor(b.time/3)%2;
    if(lm===1){
      ctx.fillStyle='rgba(255,43,214,.7)';
      ctx.beginPath();ctx.arc(-b.r*.3,-b.r*.05,b.r*.11,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(b.r*.3,-b.r*.05,b.r*.11,0,TAU);ctx.fill();
    }
  }
  // boss hp ring glow
  ctx.globalAlpha=.5;
  ctx.beginPath();ctx.arc(0,0,b.r+8+Math.sin(b.pulse*2)*3,0,TAU);
  ctx.strokeStyle=b.color;ctx.lineWidth=2;ctx.stroke();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawBullets(){
  for(const b of G.bullets){
    if(b.trail){
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+1,0,TAU);
      ctx.fillStyle=b.trail;ctx.globalAlpha=.35;ctx.fill();ctx.globalAlpha=1;
    }
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);
    ctx.fillStyle=b.friend?(G.doomActive>0?'#ff2bd6':'#ffd23a'):'#ff3a5c';
    ctx.fill();
  }
}
function drawParts(){
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);
    ctx.fillStyle=p.color;ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFxs(){
  for(const f of G.fxs){
    if(f.type==='ring'){
      const t=1-f.life/f.max;
      const r=f.r0+(f.r1-f.r0)*t;
      ctx.globalAlpha=1-t;
      ctx.beginPath();ctx.arc(f.x,f.y,r,0,TAU);
      ctx.strokeStyle=f.color;ctx.lineWidth=3;ctx.stroke();
    }else if(f.type==='yeet'){
      // Big neon planet flying across
      f.x+=f.vx*(1/60); // updated in render for simplicity
      ctx.globalAlpha=Math.max(0,f.life/f.max);
      const r=f.r;
      const g=ctx.createRadialGradient(f.x-r*.3,f.y-r*.3,r*.1,f.x,f.y,r);
      g.addColorStop(0,'#9ffcff');g.addColorStop(.4,'#22f0ff');g.addColorStop(1,'#9b3bff');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(f.x,f.y,r,0,TAU);ctx.fill();
      // ring
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(.5);
      ctx.beginPath();ctx.ellipse(0,0,r*1.5,r*.3,0,0,TAU);
      ctx.strokeStyle='#ff2bd6';ctx.lineWidth=6;ctx.stroke();
      ctx.restore();
      // trail
      ctx.beginPath();ctx.moveTo(f.x-r,f.y);ctx.lineTo(f.x-r*4,f.y-r*.2);ctx.lineTo(f.x-r*4,f.y+r*.2);ctx.closePath();
      ctx.fillStyle='rgba(34,240,255,.4)';ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function draw(){
  const sx=G.shake?rand(-G.shake,G.shake):0;
  const sy=G.shake?rand(-G.shake,G.shake):0;
  ctx.save();ctx.translate(sx,sy);
  drawBG();
  drawEarth();
  drawBullets();
  for(const e of G.enemies)drawEnemy(e);
  if(G.boss)drawBoss();
  drawWingmen();
  drawShip();
  drawParts();
  drawFxs();
  ctx.restore();
}

// ---------- Game Over / Victory ----------
let _gameEnding=false;
function gameOver(){
  if(_gameEnding)return;
  _gameEnding=true;
  Audio.stop();
  Audio.sDie();
  best=Math.max(best,Math.floor(G.score));
  localStorage.setItem('ed_best',best);
  bestEl.textContent=best.toLocaleString();
  goTitle.textContent='EARTH IS COOKED';
  goSub.textContent='The comets are smug.';
  goScore.textContent=Math.floor(G.score).toLocaleString();
  goBest.textContent=best.toLocaleString();
  goWave.textContent='S'+G.stage+' W'+G.waveInStage;
  goKills.textContent=G.kills;
  // Pause world while game-over dialog plays
  state=STATE.DIALOG;
  showDialog('gameover',()=>{
    state=STATE.OVER;
    gameoverEl.style.display='flex';
    _gameEnding=false;
  });
}

function victoryScreen(){
  state=STATE.OVER;
  Audio.stop();
  best=Math.max(best,Math.floor(G.score));
  localStorage.setItem('ed_best',best);
  bestEl.textContent=best.toLocaleString();
  goTitle.textContent='EARTH SAVED.';
  goSub.textContent='Cynthia unlocked. Endless awaits.';
  goScore.textContent=Math.floor(G.score).toLocaleString();
  goBest.textContent=best.toLocaleString();
  goWave.textContent='S'+G.stage+' W'+G.waveInStage;
  goKills.textContent=G.kills;
  cynthiaBtn.classList.remove('locked');
  cynthiaBtn.disabled=false;
  cynthiaBtn.textContent='CYNTHIA ✓';
  gameoverEl.style.display='flex';
}

// ---------- Init / Reset ----------
function resetGame(){
  G.score=0;G.kills=0;G.multi=1;G.multiTimer=0;
  G.earth=100;G.time=0;G.spawnT=.5;G.fireCd=0;
  G.rapid=0;G.shieldActive=0;G.shake=0;G.invuln=0;
  G.bullets=[];G.enemies=[];G.parts=[];G.fxs=[];
  G.doomCharge=0;G.doomActive=0;
  G.yeetAvailable=true;
  yeetBtn.disabled=false;yeetBtn.classList.add('ready');
  doomBtn.disabled=true;doomBtn.classList.remove('ready');doomBtn.classList.remove('active');
  G.weapon='pew';G.weaponLv=1;G.weaponStep=0;G.bombShots=0;
  G.stage=1;G.stageDef=null;G.waveInStage=0;
  G.weaponDropsThisStage=0;G.killsThisStage=0;
  G.boss=null;bossBarWrap.style.display='none';
  G.player=makePlayer();
  weaponInd.textContent=WEAPON_NAMES[G.weapon];
  hud();
}

function startCampaign(){
  titleEl.style.display='none';
  gameoverEl.style.display='none';
  G.isEndless=false;G.character='moore';
  resetGame();
  Audio.play('main');
  showDialog('intro',()=>{startStage(0)});
  startLoop();
}
function startEndless(){
  titleEl.style.display='none';
  gameoverEl.style.display='none';
  G.isEndless=true;G.character='moore';
  resetGame();
  Audio.play('main');
  startStage(0);
  startLoop();
}
function startCynthia(){
  if(!cynthiaUnlocked)return;
  titleEl.style.display='none';
  gameoverEl.style.display='none';
  G.isEndless=true;G.character='cynthia';
  resetGame();
  // Cynthia: faster, less armor (Earth caps lower), side-switch enemies
  if(G.player){G.player.spd=470}
  G.earth=80;
  Audio.play('main');
  showDialog('victory',()=>{startStage(0)});
  startLoop();
}

// Cynthia infiltration: occasionally flip enemy bullets to friend
function cynthiaTick(dt){
  if(G.character!=='cynthia')return;
  if(Math.random()<dt*.06){
    const targets=G.enemies.filter(e=>e.type!=='power');
    if(targets.length){
      const e=targets[irand(0,targets.length)];
      e._flipped=true;e.color='#ff7adf';
      // makes it shoot at other enemies briefly
      const nearestOther=targets.find(x=>x!==e);
      if(nearestOther){
        const ang=Math.atan2(nearestOther.y-e.y,nearestOther.x-e.x);
        G.bullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300,r:4,friend:true,dmg:1,trail:'#ff7adf'});
      }
    }
  }
}

// ---------- Main loop ----------
let _loopAlive=false;
function loop(t){
  if(state===STATE.OVER||state===STATE.TITLE){_loopAlive=false;return}
  const dt=Math.min(.033,(t-last)/1000||.016);
  last=t;
  // Defensive: never let an exception in update/draw kill the rAF chain.
  // A silent freeze is the worst kind. Surface it in the console and keep going.
  try{
    if(state!==STATE.DIALOG){
      update(dt);
      cynthiaTick(dt);
    }
    draw();
  }catch(e){
    console.error('[earthline] frame error:',e);
  }
  requestAnimationFrame(loop);
}
function startLoop(){
  if(_loopAlive)return;
  _loopAlive=true;
  last=performance.now();
  requestAnimationFrame(loop);
}

// ---------- Input ----------
addEventListener('resize',resize);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys.add(k);
  if(k===' ')e.preventDefault();
  if(k==='y')planetaryYeet();
  if(k==='d')tryDoomSquadron();
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

canvas.addEventListener('pointerdown',e=>{
  // Audio unlock
  if(!Audio.unlocked){Audio.play(G.boss?'boss':'main');Audio.ensureAC()}
  if(state===STATE.DIALOG){advanceDialog();return}
  if(state!==STATE.PLAYING && state!==STATE.BOSS)return;
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  pointer.active=true;fire=true;
  pointer.x=x;pointer.y=y;pointer.startX=x;pointer.startY=y;pointer.downTime=performance.now();
});
canvas.addEventListener('pointermove',e=>{
  if(!pointer.active)return;
  const r=canvas.getBoundingClientRect();
  pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;
});
function pointerUp(){pointer.active=false;fire=false}
canvas.addEventListener('pointerup',pointerUp);
canvas.addEventListener('pointercancel',pointerUp);

// Comic dialog tap (independent of canvas)
comicEl.addEventListener('pointerdown',()=>{advanceDialog()});

// Buttons
startBtn.onclick=startCampaign;
endlessBtn.onclick=startEndless;
cynthiaBtn.onclick=startCynthia;
goRetry.onclick=()=>{
  gameoverEl.style.display='none';
  titleEl.style.display='flex';
  state=STATE.TITLE;
};
yeetBtn.addEventListener('pointerdown',e=>{e.stopPropagation();planetaryYeet()});
doomBtn.addEventListener('pointerdown',e=>{e.stopPropagation();tryDoomSquadron()});
soundToggle.addEventListener('pointerdown',e=>{e.stopPropagation();Audio.toggleMute()});

// Visibility: pause audio when hidden
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){bgm.pause();bossBgm.pause();doomBgm.pause()}
  else if(state===STATE.PLAYING||state===STATE.BOSS){
    if(G.doomActive>0)Audio.play('doom');
    else Audio.play(G.boss?'boss':'main');
  }
});

// Splash → title transition (one-time, first launch of session)
const splashEl=document.getElementById('splash');
function dismissSplash(){
  if(!splashEl||splashEl.classList.contains('fadeOut'))return;
  // Unlock audio context on the user-gesture tap so the title music can start later
  Audio.ensureAC();
  // Pre-warm the tracks we'll need on first transition so audio swaps don't hitch
  Audio.preload('boss');
  Audio.preload('doom');
  splashEl.classList.add('fadeOut');
  setTimeout(()=>{if(splashEl.parentNode)splashEl.parentNode.removeChild(splashEl)},400);
}
splashEl.addEventListener('pointerdown',dismissSplash);

// Bootstrap
(async ()=>{
  await ASSET_LOAD;
  resize();
  // Pre-render once so title screen has a backdrop
  drawBG();
  drawEarth();
})();

// Register service worker for PWA / offline
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

})();
</script>
