<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0014" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Earthline Defender</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/img/moore_gunns.png" />
<style>
  :root{
    --bg:#05000d;
    --magenta:#ff2bd6;
    --magenta-soft:#ff77e4;
    --cyan:#22f0ff;
    --green:#7dff4d;
    --purple:#9b3bff;
    --yellow:#ffd23a;
    --red:#ff3a5c;
    --ink:#0a0014;
  }
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"Impact","Arial Black",system-ui,sans-serif;touch-action:none;letter-spacing:.02em}
  canvas#c{display:block;width:100vw;height:100vh;background:#02000a;image-rendering:pixelated}

  /* ============ HUD ============ */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:grid;grid-template-rows:auto auto 1fr auto;font-weight:900;overflow:hidden}
  #hudTop{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 6px;text-shadow:0 0 8px #000,0 2px 0 #000;min-width:0}
  /* min-width:0 + overflow:hidden so no inner content can ever blow out
     the 3-column grid and shove the right cell off-screen. */
  .hCell{padding:6px 10px;border:2px solid rgba(255,43,214,.55);background:linear-gradient(180deg,rgba(10,0,30,.85),rgba(20,0,40,.6));border-radius:10px;box-shadow:0 0 12px rgba(255,43,214,.25),inset 0 0 16px rgba(34,240,255,.08);min-width:0;overflow:hidden}
  .hCell .lbl{font-size:9px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;font-weight:700}
  .hCell .val{font-size:18px;line-height:1;color:#fff;text-shadow:0 0 8px var(--magenta),0 0 14px var(--magenta)}
  .hCell.right{text-align:right}
  .hCell .small{font-size:11px;color:var(--green);letter-spacing:.1em}
  #hudCenter{display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column}
  #waveBanner{display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(90deg,rgba(155,59,255,.0),rgba(255,43,214,.35),rgba(155,59,255,.0));border-top:1px solid rgba(255,43,214,.5);border-bottom:1px solid rgba(155,43,214,.5);font-size:14px;color:#fff;text-shadow:0 0 10px var(--magenta);letter-spacing:.18em}
  #waveBanner .tri{color:var(--yellow);font-size:14px;text-shadow:0 0 10px var(--yellow);animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  /* Boss HP card lives in its OWN HUD grid row (between hudTop and the
     gameplay area). Width derived from the row, not the viewport, so it
     can't push the top-row grid wider than the viewport. */
  #bossBarWrap{display:none;flex-direction:column;align-items:stretch;max-width:420px;margin:0 auto 6px;padding:4px 10px;background:rgba(10,0,20,.7);border:1px solid rgba(255,43,214,.6);border-radius:8px;box-sizing:border-box;width:calc(100% - 24px)}
  #bossBarWrap .bossName{font-size:11px;letter-spacing:.22em;color:var(--magenta-soft);text-align:center;text-shadow:0 0 8px var(--magenta)}
  #bossBar{height:8px;background:#1a0030;border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.2);margin-top:3px}
  #bossBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ffd23a,#ff2bd6,#9b3bff);box-shadow:0 0 12px var(--magenta);transition:width .25s}

  #hudBottom{padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
  #weaponInd{margin:0 auto;font-size:11px;color:var(--yellow);letter-spacing:.22em;text-shadow:0 0 10px var(--yellow);background:rgba(0,0,0,.55);padding:4px 12px;border:1px solid var(--yellow);border-radius:14px;pointer-events:none;display:inline-block;align-self:center;white-space:nowrap;text-align:center}

  #bottomBtns{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
  .actionBtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#1a0030,#0a0014 70%);font-family:inherit;font-weight:900;font-size:10px;letter-spacing:.14em;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:6px;flex:0 0 auto}
  .actionBtn .icon{font-size:20px;display:block;margin-bottom:2px}
  .actionBtn:disabled{opacity:.55;cursor:default}
  .actionBtn .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.55) 0deg,rgba(0,0,0,.55) 360deg);pointer-events:none}
  .actionBtn .timer{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:28px;letter-spacing:.06em;color:var(--yellow);text-shadow:0 0 14px var(--yellow),0 0 22px var(--yellow),0 2px 0 #000;font-weight:900;text-align:center;pointer-events:none;display:none;line-height:1}
  .actionBtn.active .timer{display:block}
  .actionBtn.active > span{opacity:.15;transition:opacity .2s}

  #yeetBtn{border:3px solid var(--green);color:var(--green);text-shadow:0 0 8px var(--green);box-shadow:0 0 18px rgba(125,255,77,.35),inset 0 0 14px rgba(125,255,77,.2)}
  #yeetBtn .icon{text-shadow:0 0 10px var(--green)}
  #yeetBtn:disabled{border-color:#3a4a3a;color:#7a8a7a;text-shadow:none;box-shadow:0 0 6px rgba(125,255,77,.15)}
  #yeetBtn.ready{animation:yeetPulse 1.4s infinite}
  @keyframes yeetPulse{0%,100%{box-shadow:0 0 24px rgba(125,255,77,.5),inset 0 0 18px rgba(125,255,77,.25)}50%{box-shadow:0 0 40px rgba(125,255,77,.95),inset 0 0 26px rgba(125,255,77,.5)}}

  #doomBtn{border:3px solid var(--magenta);color:var(--magenta);text-shadow:0 0 8px var(--magenta);box-shadow:0 0 18px rgba(255,43,214,.35),inset 0 0 14px rgba(255,43,214,.2)}
  #doomBtn .icon{text-shadow:0 0 10px var(--magenta)}
  #doomBtn:disabled{border-color:#4a2a4a;color:#8a7a8a;text-shadow:none;box-shadow:0 0 6px rgba(255,43,214,.15)}
  #doomBtn.ready{animation:doomPulse 1.2s infinite}
  @keyframes doomPulse{0%,100%{box-shadow:0 0 24px rgba(255,43,214,.55),inset 0 0 18px rgba(255,43,214,.3)}50%{box-shadow:0 0 44px rgba(34,240,255,.95),inset 0 0 26px rgba(255,43,214,.6)}}
  #doomBtn.active{border-color:var(--yellow);color:var(--yellow);text-shadow:0 0 10px var(--yellow);box-shadow:0 0 30px rgba(255,210,58,.85),inset 0 0 18px rgba(255,210,58,.4)}
  #doomBtn.active .icon{text-shadow:0 0 12px var(--yellow)}

  /* Smaller screens (≤380w): shrink action buttons */
  @media (max-width:380px){
    .actionBtn{width:76px;height:76px;font-size:9px}
    .actionBtn .icon{font-size:18px}
  }
  /* Very tall iPhones get a bit more room — already covered by flex */

  /* Doom Squadron portrait bubbles */
  #doomActive{position:fixed;top:30%;left:0;right:0;display:none;justify-content:space-between;padding:0 8px;z-index:4;pointer-events:none}
  .doomBubble{width:64px;height:64px;border-radius:50%;border:3px solid var(--magenta);box-shadow:0 0 18px var(--magenta);background-position:center;background-size:170%;background-repeat:no-repeat;position:relative}
  .doomBubble.hank{background-image:url('assets/img/doom_squadron.png');background-position:30% 35%}
  .doomBubble.tank{background-image:url('assets/img/doom_squadron.png');background-position:75% 35%}
  .doomBubble .nm{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--green);letter-spacing:.18em;text-shadow:0 0 6px #000;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px}
  #doomTimer{position:fixed;top:calc(30% + 70px);left:50%;transform:translateX(-50%);color:var(--green);font-size:12px;letter-spacing:.22em;text-shadow:0 0 8px var(--green);display:none;z-index:4}

  /* ============ Splash (first thing seen) ============ */
  #splash{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;background:#02000a url('assets/img/splash.jpg') center center/cover no-repeat;image-rendering:pixelated;cursor:pointer;padding:0 0 calc(58px + env(safe-area-inset-bottom,0px))}
  #splash::after{content:"TAP TO PLAY";color:var(--green);font-size:13px;letter-spacing:.38em;text-shadow:0 0 12px var(--green),0 0 22px rgba(125,255,77,.6);animation:coinBlink 1s infinite;background:rgba(2,0,10,.55);padding:6px 16px;border:1px solid rgba(125,255,77,.6);border-radius:6px}
  #splash.fadeOut{opacity:0;transition:opacity .35s ease-out;pointer-events:none}

  /* ============ Title screen ============ */
  #title{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:center;background:#02000a;background-size:cover;background-position:center;z-index:10}
  #title .titleArt{position:absolute;inset:0;background-image:url('assets/img/moore_gunns.png');background-size:cover;background-position:center top;opacity:.96}
  #title .titleVignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(0,0,0,0) 0%,rgba(0,0,0,.0) 35%,rgba(0,0,0,.7) 80%,rgba(2,0,10,1) 100%),linear-gradient(180deg,rgba(2,0,10,0) 55%,rgba(2,0,10,.92) 100%)}
  #title .titleContent{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:100%;padding:0 18px calc(28px + env(safe-area-inset-bottom,0px))}
  #title .insertCoin{font-size:14px;color:var(--green);letter-spacing:.32em;text-shadow:0 0 12px var(--green);animation:coinBlink 1.1s infinite;margin-bottom:6px}
  @keyframes coinBlink{0%,49%,100%{opacity:1}50%,99%{opacity:.15}}
  #title .tagline{font-size:13px;color:var(--magenta-soft);letter-spacing:.24em;text-align:center;text-shadow:0 0 10px var(--magenta);margin-bottom:14px}
  #title .startBtn{pointer-events:auto;background:linear-gradient(135deg,var(--magenta),var(--purple));color:#fff;border:0;border-radius:14px;padding:16px 28px;font-family:inherit;font-weight:900;font-size:18px;letter-spacing:.22em;box-shadow:0 0 24px rgba(255,43,214,.6),0 8px 24px rgba(0,0,0,.5);text-shadow:0 0 8px #000;cursor:pointer;width:min(420px,90%)}
  #title .startBtn:active{transform:translateY(1px)}
  #title .subRow{display:flex;gap:8px;margin-top:10px;width:min(420px,90%)}
  #title .subBtn{flex:1;background:rgba(0,0,0,.6);color:var(--cyan);border:2px solid var(--cyan);border-radius:10px;padding:10px;font-family:inherit;font-weight:900;font-size:11px;letter-spacing:.18em;cursor:pointer}
  #title .subBtn.locked{opacity:.5;border-color:#666;color:#888}
  #title .credits{font-size:10px;color:#7a6a8a;letter-spacing:.18em;margin-top:14px}

  /* ============ Comic Dialog ============ */
  #comic{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:12;background:rgba(2,0,10,.7);padding:18px;animation:comicIn .25s ease-out}
  @keyframes comicIn{from{opacity:0}to{opacity:1}}
  #comicPanel{width:min(560px,100%);background:#0a0014;border:4px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,0 0 0 6px var(--magenta),0 0 30px rgba(255,43,214,.6),12px 12px 0 rgba(0,0,0,.7);position:relative;padding:0;overflow:hidden;transform:rotate(-1.2deg)}
  #comicPanel .ribbon{background:linear-gradient(90deg,var(--magenta),var(--purple));color:#fff;font-size:13px;letter-spacing:.24em;padding:6px 12px;border-bottom:3px solid #000;text-shadow:0 0 6px #000;display:flex;justify-content:space-between;align-items:center}
  #comicPanel .ribbon .who{font-size:14px}
  #comicPanel .ribbon .tap{font-size:10px;color:var(--yellow);text-shadow:0 0 6px var(--yellow);animation:blink 1s infinite}
  #comicPanel .body{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:12px;background:linear-gradient(180deg,#1a0030,#0a0014)}
  #comicPanel .portrait{width:96px;height:96px;border:3px solid #fff;border-radius:6px;background:#000;background-size:cover;background-position:center;box-shadow:0 0 12px rgba(255,43,214,.5)}
  #comicPanel .bubble{background:#fff;color:#000;padding:10px 12px;border-radius:6px 6px 6px 0;font-family:"Georgia","Times New Roman",serif;font-weight:700;font-size:14px;line-height:1.3;position:relative;letter-spacing:.01em}
  #comicPanel .bubble::after{content:"";position:absolute;left:-10px;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-right-color:#fff}

  /* ============ Wave clear / Boss announce ============ */
  #stinger{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:11;pointer-events:none}
  #stinger .stText{font-size:clamp(36px,12vw,72px);color:#fff;text-shadow:0 0 18px var(--magenta),0 0 36px var(--magenta),0 4px 0 #000;letter-spacing:.18em;text-align:center;animation:stIn .4s cubic-bezier(.2,.9,.3,1.4)}
  @keyframes stIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

  /* ============ Game over ============ */
  #gameover{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:11;background:rgba(2,0,10,.92);padding:18px}
  #goPanel{width:min(480px,100%);text-align:center;padding:22px;border:3px solid var(--magenta);border-radius:16px;background:linear-gradient(180deg,rgba(10,0,30,.95),rgba(20,0,40,.95));box-shadow:0 0 30px rgba(255,43,214,.6)}
  #goPanel h2{margin:0 0 8px;font-size:42px;letter-spacing:.06em;color:var(--magenta);text-shadow:0 0 14px var(--magenta)}
  #goPanel .sub{font-size:13px;color:var(--cyan);letter-spacing:.2em;margin-bottom:16px}
  #goPanel .stat{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed rgba(255,255,255,.2);font-size:14px;color:#fff}
  #goPanel .stat span:first-child{color:var(--cyan);letter-spacing:.18em;font-size:11px}
  #goPanel button{margin-top:16px;width:100%;padding:14px;background:linear-gradient(135deg,var(--magenta),var(--purple));color:#fff;border:0;border-radius:12px;font-family:inherit;font-weight:900;font-size:16px;letter-spacing:.2em;box-shadow:0 0 18px rgba(255,43,214,.5);cursor:pointer}

  /* sound toggle (corner) */
  #soundToggle{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:20;width:34px;height:34px;border:2px solid var(--cyan);background:rgba(0,0,20,.7);border-radius:50%;color:var(--cyan);font-size:14px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}

  /* small toast */
  #toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);z-index:9;font-size:14px;color:#fff;text-shadow:0 0 10px var(--cyan),0 0 14px var(--magenta);letter-spacing:.22em;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}

  /* Weapon indicator now lives inside #hudBottom — see above */
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="hudTop">
    <div class="hCell">
      <div class="lbl">Score</div>
      <div class="val" id="score">0</div>
      <div class="small" id="multi">x1</div>
    </div>
    <div class="hCell" style="text-align:center">
      <div class="lbl" id="lives">EARTH 100%</div>
      <div id="waveBanner"><span class="tri">▲</span><span id="waveName">SECTOR 1</span><span class="tri">▲</span></div>
    </div>
    <div class="hCell right">
      <div class="lbl">High Score</div>
      <div class="val" id="best">0</div>
      <div class="small">CR <span id="credits">∞</span></div>
    </div>
  </div>
  <div id="bossBarWrap">
    <div class="bossName" id="bossName">BOSS</div>
    <div id="bossBar"><div id="bossBarFill"></div></div>
  </div>
  <div id="hudCenter"></div>
  <div id="hudBottom">
    <div id="weaponInd">PEW CANNON</div>
    <div id="bottomBtns">
      <button id="doomBtn" class="actionBtn" disabled>
        <span><span class="icon">🚀</span>DOOM<br>SQUAD</span>
        <div class="cd" id="doomCd"></div>
        <div class="timer" id="doomTimer">30</div>
      </button>
      <button id="yeetBtn" class="actionBtn" disabled>
        <span><span class="icon">🪐</span>PLANETARY<br>YEET</span>
        <div class="cd" id="yeetCd"></div>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Splash screen (shown first, tap to dismiss) -->
<div id="splash"></div>

<!-- Title screen -->
<div id="title">
  <div class="titleArt"></div>
  <div class="titleVignette"></div>
  <div class="titleContent">
    <div class="insertCoin">▶ INSERT COIN ◀</div>
    <div class="tagline">DEFEND EARTH. LOOK GOOD. DO IT AGAIN.</div>
    <button class="startBtn" id="startBtn">START CAMPAIGN</button>
    <div class="subRow">
      <button class="subBtn" id="endlessBtn">ENDLESS</button>
      <button class="subBtn locked" id="cynthiaBtn" disabled>CYNTHIA ?</button>
    </div>
    <div class="credits">© EARTH SENTINEL COMMAND · v1.0</div>
  </div>
</div>

<!-- Comic dialog overlay -->
<div id="comic">
  <div id="comicPanel">
    <div class="ribbon"><span class="who" id="comicWho">CAPTAIN MOORE GUNNS</span><span class="tap" id="comicTap">TAP TO CONTINUE ▶</span></div>
    <div class="body">
      <div class="portrait" id="comicPortrait"></div>
      <div class="bubble" id="comicText">...</div>
    </div>
  </div>
</div>

<!-- Stinger overlay (wave clear / boss incoming) -->
<div id="stinger"><div class="stText" id="stingerText"></div></div>

<!-- Game over -->
<div id="gameover">
  <div id="goPanel">
    <h2 id="goTitle">EARTH IS COOKED</h2>
    <div class="sub" id="goSub">The comets are smug.</div>
    <div class="stat"><span>SCORE</span><span id="goScore">0</span></div>
    <div class="stat"><span>BEST</span><span id="goBest">0</span></div>
    <div class="stat"><span>WAVE</span><span id="goWave">1</span></div>
    <div class="stat"><span>KILLS</span><span id="goKills">0</span></div>
    <button id="goRetry">RUN IT BACK</button>
  </div>
</div>

<button id="soundToggle" title="Sound">🔊</button>

<audio id="bgm" loop preload="auto"></audio>
<audio id="bossBgm" loop preload="auto"></audio>
<audio id="doomBgm" loop preload="auto"></audio>

<script>
/* ===========================================================
   EARTHLINE DEFENDER
   Mobile-first vertical rail shooter
   Single-file, canvas-based, PWA-ready
   =========================================================== */
(()=>{
'use strict';

// ---------- DOM refs ----------
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const titleEl=document.getElementById('title');
const startBtn=document.getElementById('startBtn');
const endlessBtn=document.getElementById('endlessBtn');
const cynthiaBtn=document.getElementById('cynthiaBtn');
const scoreEl=document.getElementById('score');
const multiEl=document.getElementById('multi');
const livesEl=document.getElementById('lives');
const waveNameEl=document.getElementById('waveName');
const bestEl=document.getElementById('best');
const bossBarWrap=document.getElementById('bossBarWrap');
const bossBarFill=document.getElementById('bossBarFill');
const bossNameEl=document.getElementById('bossName');
const yeetBtn=document.getElementById('yeetBtn');
const yeetCd=document.getElementById('yeetCd');
const doomBtn=document.getElementById('doomBtn');
const doomCd=document.getElementById('doomCd');
const doomTimerEl=document.getElementById('doomTimer');
const weaponInd=document.getElementById('weaponInd');
const toast=document.getElementById('toast');
const comicEl=document.getElementById('comic');
const comicWho=document.getElementById('comicWho');
const comicText=document.getElementById('comicText');
const comicPortrait=document.getElementById('comicPortrait');
const stingerEl=document.getElementById('stinger');
const stingerText=document.getElementById('stingerText');
const gameoverEl=document.getElementById('gameover');
const goTitle=document.getElementById('goTitle');
const goSub=document.getElementById('goSub');
const goScore=document.getElementById('goScore');
const goBest=document.getElementById('goBest');
const goWave=document.getElementById('goWave');
const goKills=document.getElementById('goKills');
const goRetry=document.getElementById('goRetry');
const soundToggle=document.getElementById('soundToggle');
const bgm=document.getElementById('bgm');
const bossBgm=document.getElementById('bossBgm');
const doomBgm=document.getElementById('doomBgm');

// ---------- Constants ----------
const TAU=Math.PI*2;
const STATE={TITLE:'title',PLAYING:'playing',BOSS:'boss',DIALOG:'dialog',OVER:'over',CLEAR:'clear'};
const WEAPONS=['pew','laser','missiles','pyro'];
const WEAPON_NAMES={pew:'PEW CANNON',laser:'LASER LANCE',missiles:'SHREDDER MISSILES',pyro:'PYRO PULSE',quake:'EARTHQUAKE BOMB'};
const PORTRAITS={
  moore:{img:'assets/img/moore_gunns.png',pos:'45% 18%'},
  hank:{img:'assets/img/doom_squadron.png',pos:'25% 35%'},
  tank:{img:'assets/img/doom_squadron.png',pos:'72% 35%'},
  cynthia:{img:'assets/img/cynthia_cannon.png',pos:'22% 30%'}
};

// ---------- Asset loading ----------
const ASSETS={};
function loadImg(key,src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{ASSETS[key]=img;res(img)};
    img.onerror=()=>{ASSETS[key]=null;console.warn('Asset missing',src);res(null)};
    img.src=src;
  });
}
const ASSET_LOAD=Promise.all([
  loadImg('starfield','assets/img/starfield.png'),

// ---------- Audio Manager ----------
const Audio={
  tracks:{
    main:'assets/audio/Starshield_Loop.mp3',
    boss:'assets/audio/Boss_Theme.mp3',
    doom:'assets/audio/Doom_Squadron.mp3',
    title:'assets/audio/Title_Theme.mp3',
    clear:'assets/audio/Wave_Clear.mp3',
    over:'assets/audio/Game_Over.mp3'
  },
  current:null,
  preDoom:null, // restore this track when Doom Squadron ends
  muted:false,
  unlocked:false,
  vol:.5,
  _elFor(name){return name==='boss'?bossBgm:name==='doom'?doomBgm:bgm},
  async play(name){
    const src=this.tracks[name];
    if(!src) return;
    const el=this._elFor(name);
    const elements=[bgm,bossBgm,doomBgm];
    if(this.current===name && !el.paused) return;
    try{
      for(const o of elements){if(o!==el)o.pause()}
      // Only reload the media element if the source actually changed —
      // setting `el.src` to the same URL forces a reload that can hitch
      // playback on mobile (this is the Doom→main transition "freeze").
      if(el._loadedSrc !== src){
        el.src=src;
        el._loadedSrc=src;
      }
      el.volume=this.muted?0:this.vol;
      el.muted=this.muted;
      await el.play();
      this.current=name;
      this.unlocked=true;
    }catch(e){
      // Graceful fallback: track missing or autoplay blocked
      console.warn('Audio play failed for',name,e.message);
    }
  },
  // Eagerly attach src + trigger metadata load without playing. Lets us
  // pre-warm the boss/doom tracks after the user's first gesture so the
  // first real switch is instant.
  preload(name){
    const src=this.tracks[name];if(!src)return;
    const el=this._elFor(name);
    if(el._loadedSrc===src)return;
    el.src=src;el._loadedSrc=src;
    try{el.load()}catch(e){}
  },
  startDoom(){this.preDoom=this.current||'main';this.play('doom')},
  endDoom(){const t=this.preDoom||'main';this.preDoom=null;this.play(t)},
  stop(){bgm.pause();bossBgm.pause();doomBgm.pause();this.current=null},
  toggleMute(){
    this.muted=!this.muted;
    [bgm,bossBgm,doomBgm].forEach(el=>{el.muted=this.muted;el.volume=this.muted?0:this.vol});
    soundToggle.textContent=this.muted?'🔇':'🔊';
  },
  // Tiny SFX synth via WebAudio (no sample files needed)
  ac:null,
  ensureAC(){
    if(!this.ac){
      try{this.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    }
    return this.ac;
  },
  beep(type,freq,dur,vol=.15,sweep=0){
    if(this.muted)return;
    const ac=this.ensureAC();if(!ac)return;
    try{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
      if(sweep)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+sweep),ac.currentTime+dur);
      g.gain.setValueAtTime(vol,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);
      o.connect(g).connect(ac.destination);
      o.start();o.stop(ac.currentTime+dur);
    }catch(e){}
  },
  // Per-sound throttle: prevents the WebAudio context from being flooded
  // when doom + rapid stack and the player is firing dozens of shots/sec.
  _lastT:Object.create(null),
  _throttle(name,ms){
    const now=performance.now();
    if((now-(this._lastT[name]||0))<ms)return false;
    this._lastT[name]=now;
    return true;
  },
  sShoot(){if(!this._throttle('shoot',55))return;this.beep('square',780,.06,.06,-300)},
  sLaser(){if(!this._throttle('laser',55))return;this.beep('sawtooth',1200,.12,.07,-800)},
  sMissile(){if(!this._throttle('missile',75))return;this.beep('triangle',420,.18,.09,400)},
  sQuake(){if(!this._throttle('quake',120))return;this.beep('sawtooth',90,.4,.18,-60)},
  sPyro(){if(!this._throttle('pyro',60))return;this.beep('sawtooth',280,.16,.11,-160);setTimeout(()=>this.beep('triangle',180,.14,.07,-90),35)},
  sChain(){if(!this._throttle('chain',55))return;this.beep('triangle',360,.09,.06,-160)},
  sHit(){if(!this._throttle('hit',40))return;this.beep('square',220,.08,.07,-120)},
  sExplode(){this.beep('sawtooth',180,.28,.13,-150);setTimeout(()=>this.beep('square',90,.2,.1,-60),60)},
  sPower(){this.beep('triangle',880,.18,.1,400);setTimeout(()=>this.beep('triangle',1320,.18,.1,400),80)},
  sYeet(){this.beep('sawtooth',60,.6,.2,800);setTimeout(()=>this.beep('square',1200,.4,.15,-1000),200)},
  sBossSpawn(){this.beep('sawtooth',180,.6,.2,-100);setTimeout(()=>this.beep('square',90,.4,.15,-40),200)},
  sShield(){this.beep('triangle',520,.2,.08,200)},
  sDie(){this.beep('sawtooth',440,.6,.2,-380)}
};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- Particle / FX ----------
// Soft caps so a cascade of bursts during boss + AOE chaos can't balloon
// the arrays and stress per-frame filter/draw work.
const PARTS_CAP=600, FXS_CAP=64;
function burst(x,y,color,n=12,pow=140,life=.7){
  // Skip new particles entirely if we're already saturated
  if(G.parts.length>=PARTS_CAP)return;
  const room=PARTS_CAP-G.parts.length;
  const count=Math.min(n,room);
  for(let i=0;i<count;i++){
    const a=rand(0,TAU),s=rand(pow*.25,pow);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1.5,4.2),life:rand(life*.4,life),max:life,color});
  }
}
function trail(x,y,color){
  if(G.parts.length>=PARTS_CAP)return;
  G.parts.push({x:x+rand(-3,3),y:y+rand(-3,3),vx:rand(-12,12),vy:rand(20,80),r:rand(1.6,3.4),life:.4,max:.4,color});
}
// Cluster of upward-drifting fire particles in a red/orange/yellow palette.
// Used for Pyro Pulse: dropped at every enemy the splash touches so the
// damage spread is unmistakable. Capped by PARTS_CAP.
const FLAME_COLORS=['#ffec5a','#ffd23a','#ff9a3a','#ff5a3a','#ff3a2a'];
function flamePlume(x,y,n=10){
  if(G.parts.length>=PARTS_CAP)return;
  const room=PARTS_CAP-G.parts.length;
  const count=Math.min(n,room);
  for(let i=0;i<count;i++){
    const a=rand(-Math.PI*.85,-Math.PI*.15); // upward-ish
    const s=rand(45,150);
    G.parts.push({
      x:x+rand(-7,7), y:y+rand(-5,5),
      vx:Math.cos(a)*s+rand(-25,25),
      vy:Math.sin(a)*s, // negative = upward
      r:rand(2,4.6),
      life:rand(.45,.9), max:.9,
      color:FLAME_COLORS[Math.floor(rand(0,FLAME_COLORS.length))]
    });
  }
}
function flash(x,y,r,color){
  if(G.fxs.length>=FXS_CAP)G.fxs.shift();
  G.fxs.push({type:'ring',x,y,r0:r*.4,r1:r*1.6,life:.35,max:.35,color});
}
function shockwave(x,y){if(G.fxs.length>=FXS_CAP)G.fxs.shift();G.fxs.push({type:'ring',x,y,r0:10,r1:Math.max(W,H)*.9,life:.45,max:.45,color:'#fff'})}

// Splash damage helper used by Earthquake Bomb pickup and Pyro Pulse weapon.
//   color    — ring/spark hue (default yellow for quake; pyro passes orange)
//   chainLv  — when > 0, every enemy killed by the splash queues a smaller
//              follow-up explosion at its position (bounded recursion).
//   isChain  — true for chained calls; uses a quieter SFX so the audio
//              context isn't slammed by a cascade.
function applyAOE(x,y,r,dmg,excludeEnemyIdx,excludeBoss,chainLv,color,isChain){
  if(!r||!dmg)return;
  const ringColor=color||'#ffd23a';
  const isPyro=ringColor==='#ff5a3a';
  // Impact fx: pyro lays down layered rings + ember spray for that "fire
  // spreading" read; quake stays with the single ring.
  if(isPyro){
    if(G.fxs.length>=FXS_CAP)G.fxs.shift();
    G.fxs.push({type:'ring',x,y,r0:r*.1,r1:r*1.05,life:.5,max:.5,color:'#ff5a3a'});
    if(G.fxs.length>=FXS_CAP)G.fxs.shift();
    G.fxs.push({type:'ring',x,y,r0:r*.35,r1:r*.85,life:.32,max:.32,color:'#ffd23a'});
    // Ember spray outward
    const ember=Math.min(16,PARTS_CAP-G.parts.length);
    for(let i=0;i<ember;i++){
      const a=rand(0,TAU),s=rand(70,220);
      G.parts.push({
        x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
        r:rand(2,5),life:rand(.5,1.0),max:1.0,
        color:FLAME_COLORS[Math.floor(rand(0,FLAME_COLORS.length))]
      });
    }
  }else{
    if(G.fxs.length>=FXS_CAP)G.fxs.shift();
    G.fxs.push({type:'ring',x,y,r0:r*.2,r1:r,life:.4,max:.4,color:ringColor});
  }
  G.shake=Math.max(G.shake,isChain?3:7);
  if(isChain) Audio.sChain(); else Audio.sQuake();
  const r2=r*r;
  // Defer chain spawns so we don't recurse mid-loop with stale indices
  // (killEnemy splices G.enemies and would shift k).
  const chains=[];
  for(let k=G.enemies.length-1;k>=0;k--){
    if(k===excludeEnemyIdx)continue;
    const e=G.enemies[k];
    if(e.type==='power')continue;
    if(e.y<e.r)continue; // off-screen gate respected
    const dx=e.x-x,dy=e.y-y;
    if(dx*dx+dy*dy<=r2){
      e.hp-=dmg;
      // Every enemy the splash touches gets a visible flame plume so the
      // damage spread is obvious. Quake keeps the cheaper spark burst.
      if(isPyro) flamePlume(e.x,e.y,8);
      else burst(e.x,e.y,ringColor,5,150);
      if(e.hp<=0){
        e._dead=true;
        if(chainLv>0){
          chains.push({x:e.x,y:e.y,r:r*.65,dmg:Math.max(1,Math.ceil(dmg*.7)),chainLv:chainLv-1,color:ringColor});
        }
        killEnemy(e,k);
      }
    }
  }
  if(G.boss && !excludeBoss){
    const dx=G.boss.x-x,dy=G.boss.y-y;
    if(dx*dx+dy*dy<=(r+G.boss.r*.5)**2){
      G.boss.hp-=dmg;
      flash(G.boss.x,G.boss.y,G.boss.r+10,ringColor);
      if(isPyro) flamePlume(G.boss.x,G.boss.y+G.boss.r*.3,14);
      bossBarFill.style.width=Math.max(0,G.boss.hp/G.boss.maxHp*100)+'%';
      if(G.boss.hp<=0){endBoss();onBossDefeated()}
    }
  }
  // Process queued chain spawns AFTER the loop (indices are clean now)
  for(const c of chains){
    applyAOE(c.x,c.y,c.r,c.dmg,-1,false,c.chainLv,c.color,true);
  }
}

function spawnType(type){
  const b=ENEMY_DEFS[type];if(!b)return;
  const waveScale=1+(G.stage-1)*.18;
  const sc=rand(.85,1.18);
  const hp=Math.ceil(b.hp*waveScale);
  const e={
    type, x:rand(28,W-28), y:-40,
    vx:rand(-20,20), vy:b.spd*rand(.85,1.1),
    r:b.r*sc, hp, maxHp:hp, rot:rand(0,TAU), spin:rand(-2.2,2.2),
    color:b.color, score:Math.floor(b.score*sc), dmg:b.dmg,
    pulse:rand(0,TAU), shotT:rand(1,2.5), state:0
  };
  // Behaviors
  if(type==='octopus'){e.vx=rand(-50,50);e.targetY=H*rand(.25,.55)}
  if(type==='leech'){e.target=true}
  if(type==='swarmer'){e.orbit=rand(0,TAU);e.callT=rand(3,5);e.cx=e.x;e.cy=e.y}
  if(type==='blackfriday'){e.armored=true}
  if(type==='ufo'){e.shieldHits=6;e.targetY=H*rand(.18,.4);e.absorb=0}
  G.enemies.push(e);
}

// Random drop pool: weapon upgrades are NOT in here — those are scheduled
// deterministically (12 per stage) from killEnemy via forceWeaponDrop().
